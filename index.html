<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>전자출결시스템 관리자 테스트 페이지 v2.0.5</title>
  <style>
:root {
  --navy:#071d42;
  --navy-2:#0c2c5f;
  --blue:#1267d6;
  --blue-2:#eaf3ff;
  --cyan:#0d9bb8;
  --green:#12a05c;
  --green-soft:#e8f7ef;
  --orange:#f39a18;
  --orange-soft:#fff5df;
  --red:#e43d3d;
  --red-soft:#fff0f0;
  --purple:#7755d9;
  --purple-soft:#f1edff;
  --teal:#0e8f83;
  --teal-soft:#e8f8f6;
  --gray-900:#172033;
  --gray-800:#263247;
  --gray-700:#46536a;
  --gray-600:#657187;
  --gray-500:#8791a4;
  --gray-400:#b6bfce;
  --gray-300:#d8dee8;
  --gray-200:#e8edf4;
  --gray-100:#f4f7fb;
  --white:#fff;
  --shadow:0 10px 30px rgba(12,44,95,.08);
  --radius:16px;
  --sidebar:244px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef3f9;color:var(--gray-900)}
body{font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--gray-600)}
.small{font-size:12px}
.tiny{font-size:11px}
.strong{font-weight:800}
.nowrap{white-space:nowrap}
.text-right{text-align:right}
.text-center{text-align:center}
.flex{display:flex}
.flex-1{flex:1}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Login */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:linear-gradient(145deg,#061c41 0%,#0b3a7a 55%,#1267d6 100%)}
.login-hero{position:relative;overflow:hidden;padding:70px 72px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
.login-hero:before{width:520px;height:520px;right:-160px;top:-110px}
.login-hero:after{width:360px;height:360px;right:90px;bottom:-210px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;letter-spacing:-.5px}
.brand-mark{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.hero-copy{max-width:680px;position:relative;z-index:1}
.hero-copy h1{font-size:52px;line-height:1.12;margin:0 0 22px;letter-spacing:-2px}
.hero-copy p{font-size:18px;line-height:1.75;color:rgba(255,255,255,.82);margin:0;max-width:620px}
.hero-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:34px}
.hero-step{padding:13px 10px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-size:12px;text-align:center}
.hero-step b{display:block;font-size:15px;margin-bottom:3px}
.login-panel{background:#f7f9fc;padding:48px;display:flex;align-items:center;justify-content:center}
.login-card{width:min(470px,100%);background:#fff;border:1px solid var(--gray-200);border-radius:26px;padding:38px;box-shadow:0 24px 70px rgba(1,19,48,.18)}
.login-card h2{font-size:28px;margin:0 0 8px;letter-spacing:-.8px}
.login-card .lead{margin:0 0 26px;color:var(--gray-600)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:750;font-size:13px;color:var(--gray-800)}
.input,.select,.textarea{width:100%;border:1px solid var(--gray-300);background:#fff;border-radius:10px;padding:11px 13px;color:var(--gray-900);outline:none;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,103,214,.12)}
.textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--gray-300);background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;color:var(--gray-800);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(28,45,78,.08)}
.btn-primary{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-soft{background:var(--gray-100)}
.btn-ghost{background:transparent}
.btn-sm{min-height:32px;padding:6px 10px;font-size:12px;border-radius:8px}
.btn-lg{min-height:48px;padding:12px 18px;font-size:15px}
.btn-block{width:100%}
.demo-box{margin-top:22px;background:var(--gray-100);border-radius:13px;padding:14px;border:1px solid var(--gray-200)}
.demo-title{font-size:12px;font-weight:800;margin-bottom:8px;color:var(--gray-700)}
.demo-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.demo-account{border:1px solid var(--gray-300);background:#fff;border-radius:8px;padding:8px 10px;text-align:left;font-size:12px}
.demo-account b{display:block;color:var(--navy-2);margin-bottom:2px}

/* App shell */
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:64px 1fr}
.topbar{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.topbar .brand{font-size:18px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900}
.sidebar{grid-row:2;background:#0b244b;color:#d9e8ff;padding:18px 14px 28px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.role-panel{border-radius:13px;padding:12px;margin-bottom:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.role-panel .role-name{font-weight:900;color:#fff;margin-bottom:3px}
.role-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.role-developer{--role:var(--purple);--role-soft:var(--purple-soft)}
.role-pm{--role:var(--blue);--role-soft:var(--blue-2)}
.role-exam{--role:var(--green);--role-soft:var(--green-soft)}
.role-building{--role:var(--orange);--role-soft:var(--orange-soft)}
.role-field{--role:var(--teal);--role-soft:var(--teal-soft)}
.nav-group{margin:14px 0 5px;padding:0 10px;font-size:11px;color:#7ea2d7;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.nav-item{width:100%;border:0;color:#c9dbf5;background:transparent;border-radius:10px;padding:10px 11px;display:flex;align-items:center;gap:10px;text-align:left;margin:3px 0;font-weight:700}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--role,var(--blue));color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.18)}
.nav-icon{width:22px;text-align:center;font-size:16px}
.content{grid-column:2;grid-row:2;padding:24px 26px 44px;min-width:0}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.page-title h1{margin:0;font-size:27px;letter-spacing:-.9px}
.page-title p{margin:7px 0 0;color:var(--gray-600)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* components */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:17px 18px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
.card-sub{font-size:12px;color:var(--gray-600);margin-top:3px}
.card-body{padding:18px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:16px;background:#fff;border:1px solid var(--gray-200);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.kpi .label{font-size:12px;font-weight:800;color:var(--gray-700)}
.kpi .value{font-size:26px;font-weight:950;line-height:1.15;margin-top:4px;white-space:nowrap}
.kpi .value small{font-size:12px;font-weight:700;margin-left:3px}
.kpi-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;white-space:nowrap;border:1px solid transparent}
.badge-blue{background:var(--blue-2);color:var(--blue)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-orange{background:var(--orange-soft);color:#d77d00}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-gray{background:var(--gray-100);color:var(--gray-600);border-color:var(--gray-200)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.section-title{font-size:18px;font-weight:900;margin:0 0 12px;letter-spacing:-.4px}
.toolbar{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:13px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar .field{min-width:145px;flex:1}
.toolbar .field.narrow{min-width:120px;max-width:180px}
.toolbar .field.wide{min-width:220px}
.table-wrap{overflow:auto;border:1px solid var(--gray-200);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 12px;border-bottom:1px solid var(--gray-200);text-align:left;vertical-align:middle}
th{background:#f5f8fc;color:var(--gray-700);font-size:12px;font-weight:900;white-space:nowrap;position:sticky;top:0;z-index:2}
td{font-size:12px;color:var(--gray-800)}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fbfdff}
tr.closed td{background:#eef1f5!important;color:#7a8497}
.progress{height:8px;background:#e8edf4;border-radius:999px;overflow:hidden;min-width:80px}
.progress > span{display:block;height:100%;background:var(--green);border-radius:999px}
.progress.orange > span{background:var(--orange)}
.progress.red > span{background:var(--red)}
.progress.blue > span{background:var(--blue)}
.notice{border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.notice-info{background:#edf5ff;border-color:#cbe0ff;color:#174f9e}
.notice-success{background:var(--green-soft);border-color:#bfe8d1;color:#117545}
.notice-warning{background:var(--orange-soft);border-color:#ffd891;color:#8b5b06}
.notice-danger{background:var(--red-soft);border-color:#ffc7c7;color:#a52626}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}
.step{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:12px;display:flex;align-items:center;gap:9px;position:relative;min-width:0}
.step.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(18,103,214,.08)}
.step.done{background:#f0fbf5;border-color:#c7ebd6}
.step-num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-200);font-weight:900;color:var(--gray-700);flex:0 0 auto}
.step.active .step-num{background:var(--blue);color:#fff}.step.done .step-num{background:var(--green);color:#fff}
.step-label{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* settings */
.setting-row{display:grid;grid-template-columns:1.25fr 1.8fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--gray-200)}
.setting-row:last-child{border-bottom:0}
.setting-name{font-weight:850}
.setting-desc{font-size:12px;color:var(--gray-600)}
.switch{position:relative;width:48px;height:26px;display:inline-block}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#b9c1ce;border-radius:999px;transition:.2s}
.switch span:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:after{transform:translateX(22px)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--gray-200);padding:0 18px;background:#fff;border-radius:14px 14px 0 0;overflow:auto}
.tab{border:0;background:transparent;padding:13px 12px;color:var(--gray-600);font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.term-preview{background:linear-gradient(135deg,#eef5ff,#f9fbff);border:1px solid #d8e7fb;border-radius:14px;padding:18px}
.term-token{display:flex;gap:8px;align-items:center;margin:7px 0}
.term-token .from{min-width:110px;color:var(--gray-600)}
.term-token .to{font-weight:900;color:var(--blue)}

/* Upload */
.dropzone{border:2px dashed #a8c7ef;background:#f6faff;border-radius:16px;padding:28px;text-align:center;transition:.15s}
.dropzone.drag{border-color:var(--blue);background:#eaf3ff}
.dropzone .drop-icon{font-size:34px;margin-bottom:8px}
.validation-pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.validation-stage{border:1px solid var(--gray-200);background:#fff;border-radius:11px;padding:10px;text-align:center;font-size:12px;font-weight:800}
.validation-stage.running{border-color:var(--blue);color:var(--blue);background:var(--blue-2)}
.validation-stage.ok{border-color:#bde8cf;color:var(--green);background:var(--green-soft)}
.validation-stage.error{border-color:#ffc7c7;color:var(--red);background:var(--red-soft)}
.mapping-grid{display:grid;grid-template-columns:1fr 1fr 110px;gap:0;border:1px solid var(--gray-200);border-radius:12px;overflow:hidden}
.mapping-grid>div{padding:10px 12px;border-right:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);font-size:12px}
.mapping-grid>div:nth-child(3n){border-right:0}
.mapping-grid .head{background:#f5f8fc;font-weight:900;color:var(--gray-700)}
.mapping-grid>div:nth-last-child(-n+3){border-bottom:0}
.result-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.result-box{border:1px solid var(--gray-200);border-radius:12px;padding:12px;text-align:center;background:#fff}
.result-box b{font-size:23px;display:block}
.error-link{color:var(--red);font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* dashboard */
.dashboard-grid{display:grid;grid-template-columns:1.08fr 1.38fr 1fr;gap:14px}
.chart-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:16px;min-width:0}
.chart-title{font-size:14px;font-weight:900;margin-bottom:12px}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;min-height:210px}
.donut{width:164px;height:164px;border-radius:50%;background:conic-gradient(var(--green) 0 56%, var(--red) 56% 100%);position:relative;flex:0 0 auto}
.donut:after{content:"";position:absolute;inset:33px;border-radius:50%;background:#fff}
.donut-label{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:12px;color:var(--gray-600)}
.donut-label b{font-size:28px;color:var(--gray-900);display:block;line-height:1.1}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.segment-bar{display:flex;height:138px;border-radius:14px;overflow:hidden;margin-top:16px}
.segment{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:900;min-width:42px}
.segment small{display:block;font-size:11px;font-weight:700;margin-top:2px}
.room-rank{display:flex;flex-direction:column;gap:9px}
.rank-row{display:grid;grid-template-columns:minmax(115px,1fr) 1.4fr 50px;gap:9px;align-items:center;font-size:12px}
.line-chart{height:210px;position:relative;border-left:1px solid var(--gray-300);border-bottom:1px solid var(--gray-300);background:repeating-linear-gradient(to top,transparent 0,transparent 41px,#edf0f5 42px)}
.line-chart svg{width:100%;height:100%;overflow:visible}
.line-chart-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--gray-500);margin-top:6px}
.incident-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.incident-card{display:flex;align-items:center;gap:10px;border:1px solid var(--gray-200);border-radius:12px;padding:12px;background:#fff;min-width:0}
.incident-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.incident-card b{font-size:19px;display:block}

/* PDF */
.pdf-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.align-buttons{display:flex;gap:5px}
.align-btn{width:34px;height:30px;border:1px solid var(--gray-300);background:#fff;border-radius:7px;font-weight:900}
.align-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.preview-sheet{background:#f1f3f6;padding:18px;border-radius:14px;min-height:610px;display:flex;align-items:center;justify-content:center}
.paper{width:100%;max-width:570px;aspect-ratio:1/1.414;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.13);padding:28px;display:flex;flex-direction:column}
.paper-title{text-align:center;font-size:18px;font-weight:900;margin:12px 0 16px}
.paper-meta{display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px}
.paper-table{width:100%;border-collapse:collapse;min-width:0}
.paper-table th,.paper-table td{border:1px solid #555;padding:4px;font-size:8px;background:#fff;color:#111;position:static}
.paper-footer{margin-top:auto;border-top:1px solid #ddd;padding-top:12px;font-size:10px;display:grid;gap:8px}
.signer-list{max-height:220px;overflow:auto;border:1px solid var(--gray-200);border-radius:10px}
.signer-row{display:grid;grid-template-columns:26px 1fr 100px 100px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--gray-200);font-size:12px}
.signer-row:last-child{border-bottom:0}

/* Modal / toast */
.modal-backdrop{position:fixed;inset:0;background:rgba(7,23,52,.56);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0;font-size:18px}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px}
.close-x{width:32px;height:32px;border:0;border-radius:8px;background:var(--gray-100);font-size:18px}
.toast-root{position:fixed;right:22px;bottom:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border:1px solid var(--gray-200);border-left:5px solid var(--blue);box-shadow:0 14px 36px rgba(0,0,0,.15);border-radius:11px;padding:12px 14px;min-width:280px;max-width:420px;animation:slideIn .2s ease}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.warning{border-left-color:var(--orange)}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* responsive */
@media(max-width:1200px){
  :root{--sidebar:210px}
  .grid-6{grid-template-columns:repeat(3,1fr)}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .dashboard-grid>.chart-card:last-child{grid-column:1/3}
  .incident-cards{grid-template-columns:repeat(2,1fr)}
  .pdf-layout{grid-template-columns:1fr}
}
@media(max-width:900px){

      if(reset){ /* keep tool position stable */ }
      const rows=model.rows; const tbody=table.tBodies[0];
      rows.forEach(r=>r.style.display='none');
      const active=Object.entries(model.filters).filter(([,value])=>normalizeTableText(value));
      let visible=rows.filter(row=>active.every(([col,value])=>normalizeTableText(tableCellValue(row.cells[Number(col)])).includes(normalizeTableText(value))));
      if(model.sort)visible.sort((ra,rb)=>{const c=smartTableCompare(tableCellValue(ra.cells[model.sort.idx]),tableCellValue(rb.cells[model.sort.idx]));return model.sort.dir==='asc'?c:-c;});
      else visible.sort((a,b)=>rows.indexOf(a)-rows.indexOf(b));
      visible.forEach(row=>{row.style.display='';tbody.appendChild(row);});
      let empty=tbody.querySelector('.table-filter-empty');
      if(!visible.length){if(!empty){empty=document.createElement('tr');empty.className='table-filter-empty';const td=document.createElement('td');td.colSpan=table.tHead.rows[0].cells.length;td.textContent='선택한 필터 조건에 맞는 데이터가 없습니다.';empty.appendChild(td);tbody.appendChild(empty);}empty.style.display='';}else if(empty)empty.style.display='none';
      const count=table.closest('.table-wrap')?.querySelector('.table-header-count');
      if(count)count.textContent=`${fmt(visible.length)} / ${fmt(rows.length)}건 표시${active.length?` · 필터 ${active.length}개`:''}${model.sort?` · ${model.sort.dir==='asc'?'오름차순':'내림차순'}`:''}`;
    };
    pop.querySelector('.apply').addEventListener('click',apply);
    pop.querySelector('.clear').addEventListener('click',()=>{input.value='';delete model.filters[idx];anchor.classList.remove('active');apply();});
    pop.querySelector('.pop-close').addEventListener('click',closeColumnFilter);

    setTimeout(()=>input.focus(),0);
  }

  function dashboardStats(site,sessionId){

    const share=baseSite.total/d.total; const total=Math.max(1,Math.round(session.assigned*share));
    const rate=Math.max(20,Math.min(95,Number((session.rate+(baseSite.rate-d.rate)).toFixed(1))));

    return {total,attended,absent,rate,roomCount:Math.max(1,Math.round(baseSite.roomCount/4)),capacity:Math.max(total,Math.round(baseSite.capacity/4)),incidentCount:Math.round(baseSite.incidentCount*total/baseSite.total)};

  function dashboardRoomsBySession(rooms,sessionId){

  function dashboardBandData(roomCount,sessionId,rate){
    const sets={all:[3.3,33.6,39.5,17.3,6.3],s1:[3.7,31.2,38.4,19.1,7.6],s2:[4.8,35.8,39.7,14.5,5.2],s3:[2.5,33.9,41.2,16.7,5.7]};

    let p=[...(sets[sessionId]||sets.all)]; const shift=Math.max(-2,Math.min(2,(rate-56)/4));p[0]+=shift;p[4]-=shift;
    const counts=p.map(x=>Math.max(0,Math.round(roomCount*x/100)));let diff=roomCount-counts.reduce((a,b)=>a+b,0);counts[2]+=diff;
    return labels.map((x,i)=>({label:x[0],color:x[1],pct:Number(p[i].toFixed(1)),count:counts[i]}));
  }

  function loadExternalScript(src,test){

    window.__eaScriptLoads[src]=new Promise(resolve=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>resolve(test());s.onerror=()=>resolve(false);document.head.appendChild(s);});

  async function downloadPdfPreview(){
    const paper=document.querySelector('#pdf-preview-host .paper');
    if(!paper){toast('다운로드할 PDF 미리보기를 찾을 수 없습니다.','error');return;}
    toast('PDF 파일을 생성하고 있습니다.','success');
    const canvasReady=await loadExternalScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',()=>!!window.html2canvas);
    const pdfReady=await loadExternalScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',()=>!!window.jspdf?.jsPDF);
    if(!canvasReady||!pdfReady){toast('PDF 라이브러리를 불러오지 못했습니다. 출력 버튼에서 PDF로 저장해주세요.','warning');printPdfPreview();return;}
    try{
      const canvas=await window.html2canvas(paper,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const img=canvas.toDataURL('image/png');
      const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      const pageW=210,pageH=297,margin=8,maxW=pageW-margin*2,maxH=pageH-margin*2;
      let w=maxW,h=canvas.height*w/canvas.width;if(h>maxH){h=maxH;w=canvas.width*h/canvas.height;}
      pdf.addImage(img,'PNG',(pageW-w)/2,margin,w,h,'','FAST');
      pdf.save(`${state.school.code}_${state.selection.replace(/\s+/g,'_')}_출결명부.pdf`);
      toast('PDF 다운로드를 시작했습니다.','success');
    }catch(e){toast('PDF 생성 중 오류가 발생했습니다. 출력 버튼에서 PDF로 저장해주세요.','warning');printPdfPreview();}
  }

  function pdfPreview(){
    const a=state.pdf.align; const previewSigners=selectedPreviewSigners();
    const visibleRows=state.pdf.pageSize===20?8:state.pdf.pageSize===30?10:12;
    const names=['김하늘','이서준','박민지','최지훈','정수아','한유진','윤태호','오세림','강도윤','조아라','장민호','문채원'];
    const rows=Array.from({length:visibleRows},(_,i)=>`<tr><td>${i+1}</td><td>21${330061+i}</td><td>${names[i%names.length]}</td><td>J411</td><td>${i===3?'결시':'응시'}</td><td></td></tr>`).join('');
    const schoolRow=state.pdf.use?.school===false?'':`<div class="paper-aligned-row" data-preview-item="school" style="text-align:${a.school}">${esc(state.school.name)} · ${esc(state.school.code)}</div>`;
    const dateRow=state.pdf.use?.date===false?'':`<div class="paper-aligned-row" data-preview-item="date" style="text-align:${a.date}">출력일 ${todayText()}</div>`;
    const footerRow=state.pdf.use?.footer===false?'':`<div class="paper-aligned-row" data-preview-item="footer" style="text-align:${a.footer}">${esc(state.pdf.footerText||'')}</div>`;
    let signRow='<div style="text-align:center;color:#777">서명 미사용</div>';
    if(state.pdf.use?.sign===false) signRow='<div style="text-align:center;color:#777">서명 영역 미사용</div>';
    else if(previewSigners.length) signRow=`<div class="paper-signatures" data-preview-item="sign" style="text-align:${a.sign}">${previewSigners.map(s=>`<div class="paper-sign-row"><span class="who">${state.pdf.signaturePolicy==='selected'?'감독관 ':state.pdf.showRoleLabel?roleNameKorean(s.role)+' ':''}${esc(s.name)}</span><span>${esc(s.room||'무배정')} · 서명 __________</span></div>`).join('')}</div>`;
    return `<div class="preview-sheet"><div class="paper"><div class="paper-meta-stack">${schoolRow}${dateRow}</div><div class="paper-title">${state.selection} 수험생 출결 명부</div><div class="preview-policy"><span class="preview-page-size">1페이지당 ${state.pdf.pageSize}명</span>서명정책: ${signaturePolicyLabel()} · 시험일 ${formatExamPeriod(primaryPeriod())}</div><table class="paper-table preview-${state.pdf.pageSize}"><thead><tr><th>순번</th><th>수험번호</th><th>성명</th><th>${term('examRoom')}</th><th>상태</th><th>확인</th></tr></thead><tbody>${rows}${state.pdf.pageSize>visibleRows?`<tr class="preview-more"><td colspan="6">… 이 페이지에 총 ${state.pdf.pageSize}명까지 출력</td></tr>`:''}</tbody></table><div class="paper-footer">${footerRow}${signRow}<div class="text-center">1 / ${Math.ceil(state.data.total/state.pdf.pageSize)}</div></div></div></div>`;

  function signatureCsvBlob(){ const csv='감독관ID,감독관명,역할,배정고사실,서명상태\\nS001,김민수,정감독관,학림관 J411,완료\\nS002,박지현,부감독관,학림관 J411,완료\\nS099,한예비,예비감독관,무배정,대기'; return new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}); }

  function ensureJsZip(){ if(window.JSZip)return Promise.resolve(true);if(window.__jszipLoading)return window.__jszipLoading;window.__jszipLoading=new Promise(resolve=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});return window.__jszipLoading; }
  async function downloadResultFiles(all=false){
    const boxes=[...document.querySelectorAll('[data-result-file]')];const selected=all?boxes:boxes.filter(x=>x.checked);if(!selected.length){toast('다운로드할 파일을 선택해주세요.','warning');return;}
    const ready=await ensureJsZip();if(!ready){selected.forEach((box,i)=>setTimeout(()=>{if(box.dataset.resultFile==='__signature__')downloadBlob(signatureCsvBlob(),'감독관_서명_확인_목록.csv');else{const a=document.createElement('a');a.href=`sample-data/${encodeURIComponent(box.dataset.resultFile)}`;a.download=box.dataset.resultFile;a.click();}},i*250));toast('선택 파일을 개별 다운로드합니다.','warning');return;}
    const zip=new JSZip();for(const box of selected){const f=box.dataset.resultFile;if(f==='__signature__'){zip.file('감독관_서명_확인_목록.csv',signatureCsvBlob());continue;}try{const res=await fetch(`sample-data/${encodeURIComponent(f)}`);if(!res.ok)throw new Error();zip.file(f,await res.blob());}catch(e){zip.file(f.replace(/\\.xlsx$/i,'.txt'),`${box.dataset.resultName} 샘플 파일은 GitHub 배포본의 sample-data 폴더에서 확인하세요.`);}}
    const blob=await zip.generateAsync({type:'blob'});downloadBlob(blob,`전자출결_선택결과_${new Date().toISOString().slice(0,10)}.zip`);toast(`${selected.length}개 파일을 ZIP으로 생성했습니다.`,'success');
  }

    modal('학교·전형 수정',`<div class="grid grid-2"><div class="field"><label>학교</label><select class="select" id="edit-exam-school">${state.schools.map(s=>`<option value="${s.id}" ${ex.schoolId===s.id?'selected':''}>${esc(s.name)} (${esc(s.code)})</option>`).join('')}</select></div><div class="field"><label>전형 ID</label><input class="input" value="${esc(ex.id)}" disabled></div><div class="field"><label>전형코드</label><input class="input" id="edit-exam-code" value="${esc(ex.code)}"></div><div class="field"><label>전형명</label><input class="input" id="edit-exam-name" value="${esc(ex.name)}"></div><div class="field"><label>시험일</label><input class="input" type="date" id="edit-exam-date" value="${esc(ex.examDate)}"></div><div class="field"><label>담당 PM</label><select class="select" id="edit-exam-pm"><option>미배정</option>${state.accounts.filter(a=>a.role==='pm').map(a=>`<option ${ex.pm===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>상태</label><select class="select" id="edit-exam-status">${['테스트','준비','운영','종료'].map(s=>`<option ${ex.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="notice notice-info" style="margin-top:14px"><span>ⓘ</span><div>운영 상태는 권한 계정에 대시보드를 공개합니다. 테스트 상태는 개발자와 지정 PM만 접근합니다.</div></div>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="save-exam-edit">저장</button>`);
    setTimeout(()=>document.getElementById('save-exam-edit')?.addEventListener('click',()=>{
      const schoolId=document.getElementById('edit-exam-school').value;const code=document.getElementById('edit-exam-code').value.trim().toUpperCase();const name=document.getElementById('edit-exam-name').value.trim();const examDate=document.getElementById('edit-exam-date').value;const pm=document.getElementById('edit-exam-pm').value;const status=document.getElementById('edit-exam-status').value;
      if(!code||!name||!examDate){toast('전형코드, 전형명, 시험일을 입력해주세요.','error');return;}if(state.exams.some(e=>e.id!==ex.id&&e.code===code)){toast('이미 사용 중인 전형코드입니다.','error');return;}
      ex.schoolId=schoolId;ex.code=code;ex.name=name;ex.examDate=examDate;ex.pm=pm;ex.status=status;
      if(state.selection===oldName){state.selection=name;state.basic.examName=name;state.basic.examDate=examDate;const sc=schoolById(schoolId);state.school={id:sc.id,code:sc.code,name:sc.name};}
      state.auditLogs.unshift({at:new Date().toLocaleString('ko-KR'),schoolId,examId:ex.id,account:state.session.id,feature:'전형',target:name,action:'학교·전형 정보 수정'});save();closeModal();render();toast('학교·전형 정보를 저장했습니다.','success');
    }),0);
  }

  function closeExam(sessionId){
    if(!isRole('pm','exam')){toast('마감은 담당 PM 또는 전형관리자만 실행할 수 있습니다.','warning');return;}
    const sid=['s1','s2','s3','s4'].includes(sessionId)?sessionId:currentCloseSession();state.ui.closeSession=sid;
    if(isSessionClosed(sid)){toast(`${closeSessionLabel(sid)}는 이미 마감되었습니다.`,'warning');return;}
    const rows=[['학림관 J414',closeSessionLabel(sid),'출결 완료','서명 완료','마감 전'],['학림관 J409',closeSessionLabel(sid),'출결 완료','서명 완료','마감 전'],['학림관 J411',closeSessionLabel(sid),'출결 완료','서명 완료','마감 완료'],['혜화관 423',closeSessionLabel(sid),'출결 완료','서명 완료','마감 완료']];
    modal(`${closeSessionLabel(sid)} 마감 전 최종 확인`,`<div class="notice notice-warning"><span>!</span><div><b>전체 전형 마감이 아닌 ${closeSessionLabel(sid)}만 마감합니다.</b><br>마감 후 해당 교시의 운영 입력이 잠깁니다.</div></div><div class="close-summary-grid"><div class="close-summary-box"><span>대상 고사실</span><b>68실</b></div><div class="close-summary-box"><span>마감 완료</span><b style="color:var(--green)">66실</b></div><div class="close-summary-box"><span>마감 전</span><b style="color:var(--orange)">2실</b></div><div class="close-summary-box"><span>확인 필요</span><b>0실</b></div></div>${infoRows([['선택 교시',closeSessionLabel(sid)],['출결 처리','5,273 / 5,273명'],['특이사항','18건 · 미확인 0건'],['감독관 서명','68 / 68실'],['답안지 인계',state.features.answerSheet?'68 / 68실':'미사용'],['실행 권한',roleInfo().name+' '+state.session.name]])}<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>고사실</th><th>교시</th><th>출결</th><th>서명</th><th>현재 상태</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="badge badge-green">${r[2]}</span></td><td><span class="badge badge-green">${r[3]}</span></td><td><span class="badge ${r[4]==='마감 완료'?'badge-gray':'badge-blue'}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><label class="close-confirm-check"><input type="checkbox" id="close-confirm-check"><span><b>${closeSessionLabel(sid)}의 현재 마감현황과 운영 입력 잠금 범위를 확인했습니다.</b><br>확인 후 마감을 실행하면 해당 교시 결과파일과 PDF를 생성할 수 있습니다.</span></label>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="confirm-close-final" disabled>확인 후 ${closeSessionLabel(sid)} 마감</button>`);
    setTimeout(()=>{const check=document.getElementById('close-confirm-check');const btn=document.getElementById('confirm-close-final');if(!check||!btn)return;check.addEventListener('change',()=>btn.disabled=!check.checked);btn.addEventListener('click',()=>{state.close.sessions[sid]='closed';state.close.closedAt[sid]=new Date().toLocaleString('ko-KR');save();closeModal();render();toast(`${closeSessionLabel(sid)} 마감을 완료했습니다.`,'success');});},0);
  }
  function reopenExam(){ const sid=currentCloseSession();state.close.sessions[sid]='before';delete state.close.closedAt[sid];save();render();toast(`${closeSessionLabel(sid)} 마감을 해제했습니다.`,'warning'); }
  function ensureXlsx(timeoutMs=2500){
    if(window.XLSX) return Promise.resolve(true);
    if(window.__xlsxLoading) return window.__xlsxLoading;
    window.__xlsxLoading=new Promise(resolve=>{
      const script=document.createElement('script');
      let settled=false;
      const finish=(ok)=>{if(settled)return;settled=true;resolve(ok);};
      script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      script.async=true; script.onload=()=>finish(!!window.XLSX); script.onerror=()=>finish(false);
      document.head.appendChild(script);
      setTimeout(()=>finish(!!window.XLSX),timeoutMs);
    });
    return window.__xlsxLoading;
  }
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}

  function v201ValidateRows(type,rows){const errors=[];const seen=new Set();const requiredCandidate=['전형명','시험일','교시','시작시간','종료시간','고사실코드','고사실','수험번호','수험생명'];const allowedRoles=['정감독관','부감독관','예비감독관'];rows.forEach((r,i)=>{const row=i+2;if(type==='candidate'){requiredCandidate.forEach(c=>{if(String(r[c]??'').trim()==='')errors.push({row,column:c,value:'(빈 값)',message:`${c} 필수값이 없습니다.`,solution:`${c}을 입력한 뒤 다시 업로드하세요.`});});const id=String(r['수험번호']||'').trim();if(id){if(seen.has(id))errors.push({row,column:'수험번호',value:id,message:'수험번호가 중복되었습니다.',solution:'중복 행을 삭제하거나 수험번호를 수정하세요.'});seen.add(id);}if(r['교시']&&!/^([1-4])교시$/.test(String(r['교시'])))errors.push({row,column:'교시',value:r['교시'],message:'교시 형식이 올바르지 않습니다.',solution:'1교시~4교시 형식으로 입력하세요.'});if(r['시작시간']&&!/^\d{2}:\d{2}$/.test(String(r['시작시간'])))errors.push({row,column:'시작시간',value:r['시작시간'],message:'시간 형식이 올바르지 않습니다.',solution:'HH:MM 형식으로 입력하세요.'});}else{['전형명','시험일','교시','감독관명','감독관구분'].forEach(c=>{if(String(r[c]??'').trim()==='')errors.push({row,column:c,value:'(빈 값)',message:`${c} 필수값이 없습니다.`,solution:`${c}을 입력하세요.`});});if(r['감독관구분']&&!allowedRoles.includes(String(r['감독관구분'])))errors.push({row,column:'감독관구분',value:r['감독관구분'],message:'허용되지 않은 감독관 역할입니다.',solution:'정감독관/부감독관/예비감독관 중 하나로 입력하세요.'});}});return errors;}
  function v201GenerateSupervisorIds(rows){const counters={};return rows.map(r=>{const x=Object.assign({},r);if(!String(x['감독관ID']||'').trim()){const code=String(x['고사실코드']||'STBY').trim()||'STBY';counters[code]=(counters[code]||0)+1;x['감독관ID']=`SUP-${code}-${String(counters[code]).padStart(2,'0')}`;}return x;});}
  function v201AutoAssign(rows){const rooms=(state.uploadRows.candidate||[]).map(r=>({code:String(r['고사실코드']||''),site:r['고사장']||'',building:r['건물']||'',room:r['고사실']||'',session:r['교시']||''})).filter(x=>x.code);const uniq=[];const seen=new Set();rooms.forEach(r=>{const k=r.code+'|'+r.session;if(!seen.has(k)){seen.add(k);uniq.push(r);}});let idx=0;const assigned=rows.map(r=>{const x=Object.assign({},r);if(x['감독관구분']==='예비감독관')return x;if(!x['고사실코드']&&uniq.length){const room=uniq[idx++%uniq.length];x['고사실코드']=room.code;x['고사장']=room.site;x['건물']=room.building;x['고사실']=room.room;x['교시']=x['교시']||room.session;}return x;});state.invigilatorAssignments=assigned;state.uploadRows.invigilator=assigned;return assigned;}
  function v201DerivedRows(){const c=state.uploadRows.candidate||[];const i=state.uploadRows.invigilator||[];const map={};c.forEach(r=>{const key=[r['전형명'],r['시험일'],r['교시'],r['고사실코드']].join('|');if(!map[key])map[key]={exam:r['전형명']||'',date:r['시험일']||'',session:r['교시']||'',start:r['시작시간']||'',end:r['종료시간']||'',site:r['고사장']||'',building:r['건물']||'',roomCode:r['고사실코드']||'',room:r['고사실']||'',assigned:Number(r['배정인원']||0),candidateCount:0,invigilators:[]};map[key].candidateCount++;map[key].assigned=Math.max(map[key].assigned,Number(r['배정인원']||0));});i.forEach(r=>{const key=[r['전형명'],r['시험일'],r['교시'],r['고사실코드']].join('|');if(!map[key])map[key]={exam:r['전형명']||'',date:r['시험일']||'',session:r['교시']||'',start:r['시작시간']||'',end:r['종료시간']||'',site:r['고사장']||'',building:r['건물']||'',roomCode:r['고사실코드']||'',room:r['고사실']||'',assigned:0,candidateCount:0,invigilators:[]};map[key].invigilators.push(`${r['감독관명']||''}(${r['감독관구분']||''})`);});return Object.values(map);}

  developerHome=function(){const active=state.schoolAccounts.filter(a=>a.status==='사용').length;const content=`<div class="grid grid-4">${kpi('등록 학교',state.schools.length,'개','🏫','var(--purple-soft)','var(--purple)')}${kpi('학교 조회ID',state.schoolAccounts.length,'개','ID','var(--blue-2)','var(--blue)')}${kpi('사용 중 ID',active,'개','✓','var(--green-soft)','var(--green)')}${kpi('최근 로그',state.auditLogs.length,'건','≡','var(--orange-soft)','var(--orange)')}</div><div class="grid grid-2" style="margin-top:14px"><section class="card"><div class="card-header"><div><div class="card-title">개발자 업무 범위</div><div class="card-sub">학교 등록과 학교별 조회계정 발급까지만 수행합니다.</div></div><button class="btn btn-primary" data-route="developer-org">학교 등록</button></div><div class="card-body">${processList([['1','학교 등록','학교명과 학교코드를 등록합니다.'],['2','학교 조회ID 생성','입학처·담당자에게 전달 가능한 공용 조회ID를 자동 발급합니다.'],['3','학교 매칭 확인','조회ID를 학교코드와 연결합니다.'],['4','로그 확인','학교별 설정·업로드·마감 이력을 조회합니다.']])}</div></section><section class="card"><div class="card-header"><div><div class="card-title">전형 등록 정책</div><div class="card-sub">전형은 담당 PM 운영현황에서 생성합니다.</div></div></div><div class="card-body"><div class="notice notice-info"><span>ⓘ</span><div><b>개발자 단계에서는 전형 등록을 제공하지 않습니다.</b><br>학교가 등록되면 담당 PM가 수시논술, 수시실기-연극 등 전형을 직접 생성·선택·관리합니다.</div></div><button class="btn btn-block" style="margin-top:12px" data-route="developer-accounts">학교별 조회계정 보기</button></div></section></div>`;return shell(content,'개발자 홈','학교코드와 학교별 조회계정을 관리합니다.',`<button class="btn" data-route="audit">학교별 로그</button><button class="btn btn-primary" data-route="developer-org">학교 등록</button>`);};
  developerOrg=function(){const cards=state.schools.map(sc=>{const ids=state.schoolAccounts.filter(a=>a.schoolId===sc.id);return `<section class="v201-school-card"><div class="flex justify-between"><div><div class="card-title">${esc(sc.name)}</div><div class="small muted">학교코드 ${esc(sc.code)}</div></div><span class="badge ${sc.status==='사용'?'badge-green':'badge-gray'}">${esc(sc.status)}</span></div><div><span class="small muted">연결 조회ID</span><b style="display:block;margin-top:4px">${ids.length}개</b></div><div>${ids.slice(0,2).map(x=>`<span class="location-display-chip v201-school-id">${esc(x.id)}</span>`).join(' ')||'<span class="muted small">미생성</span>'}</div><button class="btn btn-sm" data-action="v201-create-school-viewer" data-school-id="${esc(sc.id)}">+ 조회ID 자동생성</button></section>`}).join('');return shell(`<div class="notice notice-info" style="margin-bottom:14px"><span>ⓘ</span><div><b>개발자는 학교와 학교별 조회ID만 관리합니다.</b><br>전형 생성은 담당 PM 운영현황에서 진행합니다.</div></div><div class="v201-school-grid">${cards}</div>`,'학교 등록','학교코드 등록 후 입학처에 전달 가능한 조회계정을 자동 생성합니다.',`<button class="btn btn-primary" data-action="open-school-modal">+ 학교 등록</button>`);};
  function v201DeveloperAccounts(){const rows=state.schoolAccounts.map(a=>{const sc=schoolById(a.schoolId);return `<tr><td><b class="v201-school-id">${esc(a.id)}</b></td><td>${esc(sc?.name||'')}</td><td>${esc(sc?.code||'')}</td><td>••••</td><td><span class="badge ${a.status==='사용'?'badge-green':'badge-gray'}">${esc(a.status)}</span></td><td>${esc(a.created||'-')}</td><td><button class="btn btn-sm" data-action="v201-copy-viewer" data-viewer-id="${esc(a.id)}">접속정보 복사</button> <button class="btn btn-sm" data-action="v201-toggle-viewer" data-viewer-id="${esc(a.id)}">${a.status==='사용'?'사용중지':'사용재개'}</button></td></tr>`}).join('');return shell(`<div class="notice notice-info v201-viewer-note"><span>ID</span><div><b>사람을 배정하지 않는 학교 공용 조회계정입니다.</b><br>입학처 또는 학교 담당자에게 전달할 수 있으며 담당범위 컬럼은 사용하지 않습니다.</div></div><section class="card"><div class="card-header"><div><div class="card-title">학교별 조회계정</div><div class="card-sub">학교코드와 자동 매칭되는 공용 조회ID입니다.</div></div><button class="btn btn-primary" data-action="v201-open-viewer-modal">+ 조회ID 생성</button></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>조회ID</th><th>학교</th><th>학교코드</th><th>비밀번호</th><th>상태</th><th>생성일</th><th>관리</th></tr></thead><tbody>${rows}</tbody></table></div></div></section>`,'학교별 조회계정','입학처와 학교 담당자가 공용으로 사용할 수 있는 조회 전용 계정입니다.','');}

  accountPage=function(developerOnly){if(developerOnly)return v201DeveloperAccounts();const allowed=managedAccountRoles();const accounts=state.accounts.filter(a=>allowed.includes(a.role));const editId=state.ui.accountEditId||'';const rows=accounts.map(a=>{const editing=editId===a.id;const places=(a.places||[]).join(' · ');if(editing)return `<tr class="v201-editing-row" data-v201-account-row="${esc(a.id)}"><td><input class="input" data-v201-account-field="id" value="${esc(a.id)}"></td><td><input class="input" data-v201-account-field="name" value="${esc(a.name)}"></td><td><select class="select" data-v201-account-field="role">${allowed.map(r=>`<option value="${r}" ${a.role===r?'selected':''}>${esc(roleDisplayName(r))}</option>`).join('')}</select></td><td><input class="input memo-input" data-v201-account-field="memo" value="${esc(a.memo||'')}"></td><td><select class="select" data-v201-account-field="placeUse"><option value="on" ${a.locationAssignmentUse?'selected':''}>사용</option><option value="off" ${!a.locationAssignmentUse?'selected':''}>미사용</option></select></td><td><input class="input place-input" data-v201-account-field="places" value="${esc(places)}" placeholder="학림관 전체 · 혜화관 전체"></td><td><select class="select" data-v201-account-field="status"><option ${a.status==='사용'?'selected':''}>사용</option><option ${a.status==='사용중지'?'selected':''}>사용중지</option></select></td><td><button class="btn btn-sm btn-green" data-action="v201-save-inline-account" data-account-id="${esc(a.id)}">저장</button> <button class="btn btn-sm" data-action="v201-cancel-inline-account">취소</button></td></tr>`;return `<tr><td><b>${esc(a.id)}</b></td><td>${esc(a.name)}</td><td>${roleBadge(a.role)}</td><td>${esc(a.memo||'-')}</td><td>${a.role==='middle'?(a.locationAssignmentUse?'<span class="badge badge-blue">사용</span>':'<span class="badge badge-gray">미사용</span>'):'-'}</td><td>${a.role==='middle'?esc(places||'미선택'):'-'}</td><td><span class="badge ${a.status==='사용'?'badge-green':'badge-gray'}">${esc(a.status)}</span></td><td><button class="btn btn-sm" data-action="v201-inline-edit-account" data-account-id="${esc(a.id)}">수정</button> <button class="btn btn-sm" data-action="toggle-account" data-account-id="${esc(a.id)}">${a.status==='사용'?'사용중지':'사용재개'}</button></td></tr>`;}).join('');const actions=isRole('pm')?`<div class="account-upload-actions"><button class="btn" data-action="download-template" data-template-type="account">⇩ 계정 양식</button><button class="btn" data-action="choose-account-excel">⇧ 엑셀 업로드</button><input type="file" id="account-excel-file" accept=".xlsx,.xls,.csv" hidden><button class="btn btn-primary" data-action="open-account-modal">+ 계정 생성</button></div>`:`<button class="btn btn-primary" data-action="open-account-modal">+ 계정 생성</button>`;return shell(`<div class="notice notice-info v201-inline-tip"><span>✎</span><div><b>수정 버튼을 누르면 목록의 각 컬럼 위치가 입력칸으로 변경됩니다.</b><br>아이디, 이름, 역할, 메모, 장소안내, 안내장소, 상태를 한 행에서 바로 수정하고 저장합니다.</div></div><section class="card"><div class="card-header"><div><div class="card-title">대학 관리자 계정 목록</div><div class="card-sub">운영범위 대신 메모를 사용하며, 중간관리자 장소안내는 사용자 화면 표시용입니다.</div></div><span class="badge badge-gray">${accounts.length}개</span></div><div class="card-body"><div class="table-wrap"><table class="v201-inline-edit-table" style="min-width:1280px"><thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>메모</th><th>장소안내</th><th>안내 장소</th><th>상태</th><th>관리</th></tr></thead><tbody>${rows}</tbody></table></div></div></section>`,'계정관리','전형관리자와 중간관리자 계정을 컬럼별 인라인 방식으로 수정합니다.',actions);};

  openAccountModal=function(){const roles=managedAccountRoles();modal('계정 생성',`<div class="grid grid-2"><div class="field"><label>아이디</label><input class="input" id="new-account-id"></div><div class="field"><label>이름</label><input class="input" id="new-account-name"></div><div class="field"><label>역할</label><select class="select" id="new-account-role">${roles.map(r=>`<option value="${r}">${esc(roleDisplayName(r))}</option>`).join('')}</select></div><div class="field"><label>메모</label><input class="input" id="new-account-memo" placeholder="입학처 운영 담당 / 연극 실기 현장지원"></div>${selectedMiddlePlaces('new',null)}</div><div class="notice notice-info" style="margin-top:14px"><span>ⓘ</span><div>중간관리자 장소안내는 사용자 화면 표시용이며 조회·입력 권한은 전형 전체입니다.</div></div>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="v201-create-account">계정 생성</button>`);bindMiddleAssignmentControls('new',document.getElementById('new-account-role'));setTimeout(()=>document.getElementById('v201-create-account')?.addEventListener('click',()=>{const id=document.getElementById('new-account-id').value.trim(),name=document.getElementById('new-account-name').value.trim(),role=document.getElementById('new-account-role').value,memo=document.getElementById('new-account-memo').value.trim();const locationAssignmentUse=role==='middle'&&document.getElementById('new-middle-assignment-use')?.checked===true;const places=locationAssignmentUse?[...document.querySelectorAll('[data-new-place]:checked')].map(x=>x.value):[];if(!id||!name){toast('아이디와 이름을 입력해주세요.','error');return;}if(state.accounts.some(a=>a.id===id)){toast('이미 사용 중인 아이디입니다.','error');return;}state.accounts.push({id,name,role,memo,scope:memo,places,locationAssignmentUse,status:'사용',password:'1234'});save();closeModal();render();toast('계정을 생성했습니다.','success');}),0);};

  pmHome=function(){const list=v201ExamList();const cards=list.map(e=>`<section class="v201-exam-card ${e.id===v201CurrentExamId()?'active':''} ${e.useStatus==='사용중지'?'disabled':''}"><div class="head"><div><div class="card-title">${esc(e.name)}</div><div class="small muted">${esc(e.code)} · ${formatExamDateWithWeekday(e.examDate)}</div></div><span class="badge ${e.useStatus==='사용중지'?'badge-gray':e.status==='운영'?'badge-green':'badge-orange'}">${esc(e.useStatus==='사용중지'?'사용중지':e.status)}</span></div><div class="small muted">업로드 ${state.uploadRows.candidate.length?state.uploadRows.candidate.length+'행':'미완료'} · 감독관 ${state.uploadRows.invigilator.length?state.uploadRows.invigilator.length+'행':'미완료'}</div><div class="actions"><button class="btn btn-sm ${e.id===v201CurrentExamId()?'btn-blue':''}" data-action="v201-select-exam" data-exam-id="${esc(e.id)}">${e.id===v201CurrentExamId()?'선택됨':'선택'}</button><button class="btn btn-sm" data-action="v201-toggle-exam-use" data-exam-id="${esc(e.id)}">${e.useStatus==='사용중지'?'사용재개':'사용중지'}</button><button class="btn btn-sm btn-red" data-action="v201-delete-exam" data-exam-id="${esc(e.id)}">삭제</button></div></section>`).join('');return shell(`<div class="notice notice-info" style="margin-bottom:14px"><span>ⓘ</span><div><b>개발자는 학교까지만 등록하고 전형은 담당 PM가 생성합니다.</b><br>전형을 선택하면 계정, 업로드, 설정값, 명칭, 결과파일 화면의 기준이 함께 변경됩니다.</div></div><div class="v201-context-bar"><div class="field"><label>현재 전형</label>${v201ExamSelect('v201-home-exam-select')}</div><div class="summary"><span class="badge badge-blue">${list.length}개 전형</span><span class="badge badge-green">${list.filter(x=>x.useStatus!=='사용중지').length}개 사용</span></div><button class="btn btn-primary" data-action="v201-open-exam-create">+ 전형 생성</button></div><div class="v201-exam-grid">${cards}</div>${v201DerivedPanel()}`,'담당 PM 운영현황','전형을 생성·선택·삭제·사용중지하고 기초데이터 업로드 현황을 확인합니다.',`<button class="btn" data-route="accounts">계정관리</button><button class="btn btn-primary" data-route="upload">업로드·자동검증</button>   terminologyPage=function(){const terms=[['examSite','고사장','고사장'],['examRoom','고사실','고사실'],['middleManager','중간관리자','복도관리자'],['examManager','전형관리자','입학처 관리자'],['incident','사고자','특이사항 학생']];const rows=terms.map(([k,base,ph])=>`<div class="v201-term-row"><div><b>${base}</b><div class="tiny muted">기본 명칭</div></div><div class="field"><input class="input" data-v201-term="${k}" value="${esc(state.terms[k]||base)}" placeholder="${ph}"></div></div>`).join('');const preview=`<section class="v201-term-preview"><div class="flex justify-between"><div><h3 class="section-title">실시간 화면 반영 예시</h3><div class="small muted">입력 즉시 메뉴·버튼·표 문구가 변경됩니다.</div></div><span class="badge badge-blue">미리보기</span></div><div class="v201-preview-nav"><div class="item">운영 대시보드</div><div class="item"><span data-v201-term-preview="examSite">${esc(term('examSite'))}</span> 선택</div><div class="item"><span data-v201-term-preview="examRoom">${esc(term('examRoom'))}</span>별 운영현황</div><div class="item"><span data-v201-term-preview="incident">${esc(term('incident'))}</span> 관리</div></div><div class="v201-preview-cards"><div class="v201-preview-card"><b>계정 역할</b><p><span data-v201-term-preview="examManager">${esc(term('examManager'))}</span><br><span data-v201-term-preview="middleManager">${esc(term('middleManager'))}</span></p></div><div class="v201-preview-card"><b>표 컬럼</b><p><span data-v201-term-preview="examSite">${esc(term('examSite'))}</span> · <span data-v201-term-preview="examRoom">${esc(term('examRoom'))}</span> · 응시율</p></div></div></section>`;return shell(`<div class="v201-context-bar"><div class="field"><label>전형 선택</label>${v201ExamSelect('v201-terms-exam-select')}</div><span class="badge badge-green">전형별 저장</span></div><div class="v201-term-layout"><section class="card"><div class="card-header"><div><div class="card-title">명칭 수정</div><div class="card-sub">온/오프 없이 필요한 명칭만 수정하며 데이터가 없으면 화면에 표시하지 않습니다.</div></div></div><div class="card-body stack">${rows}</div></section>${preview}</div>`,'학교별 명칭','   settingsFeatures=function(){const base=v201OriginalSettingsFeatures();const configs=state.incidentTypesConfig||[];const extra=`<section class="setting-section v201-settings-extra"><div class="setting-section-head"><div><h3 class="setting-section-title">운영 연동 선택값</h3><div class="setting-section-desc">활성화한 기능은 대시보드와 조회 화면에 즉시 연결됩니다.</div></div></div><div class="v201-feature-grid">${[['otherSiteCandidates','타고사장 수험생 보기','대시보드와 엑셀형 목록에서 타고사장 수험생을 조회합니다.'],['admissionPhotoConfirm','입학처 사진 확인','입학처가 사진 비교 후 상태값을 확인으로 변경합니다.'],['autoAssignInvigilator','감독관 자동배정','업로드 감독관을 고사실코드 기준으로 자동배정합니다.']].map(([k,n,d])=>`<label class="v201-feature-card ${state.features[k]?'on':''}"><div><b>${n}</b><div class="desc">${d}</div></div><span class="switch"><input type="checkbox" data-v201-feature="${k}" ${state.features[k]?'checked':''}><span></span></span></label>`).join('')}</div></section><section class="setting-section v201-settings-extra"><div class="setting-section-head"><div><h3 class="setting-section-title">사고유형별 처리 권한</h3><div class="setting-section-desc">감독관 또는 중간관리자 중 하나만 선택하거나 둘 다 선택할 수 있습니다.</div></div></div><div class="table-wrap"><table class="v201-permission-table"><thead><tr><th>사고유형</th><th>감독관</th><th>${esc(term('middleManager'))}</th><th>적용</th></tr></thead><tbody>${configs.map(x=>{const p=state.incidentPermissions[x.id]||{invigilator:true,middle:true};return `<tr><td><b>${esc(x.name)}</b></td><td><input type="checkbox" data-v201-incident-permission="${esc(x.id)}" data-role="invigilator" ${p.invigilator?'checked':''}></td><td><input type="checkbox" data-v201-incident-permission="${esc(x.id)}" data-role="middle" ${p.middle?'checked':''}></td><td><span class="badge badge-blue">${p.invigilator&&p.middle?'둘 다':p.invigilator?'감독관':p.middle?term('middleManager'):'미선택'}</span></td></tr>`}).join('')}</tbody></table></div></section>`;return base+extra;};

    const rows=state.uploadRows[type]||[],errors=state.uploadErrors[type]||[],title=type==='candidate'?'수험생':'감독관';const mapping=type==='candidate'?['전형명','시험일','교시','시작시간','종료시간','고사장','건물','고사실코드','고사실','수험번호','수험생명','배정인원','사진파일명']:['전형명','시험일','교시','시작시간','종료시간','고사장','건물','고사실코드','고사실','감독관ID','감독관명','감독관구분','서명사용여부'];const auto=type==='invigilator'?`<section class="v201-auto-assign"><div class="head"><div><b>감독관 ID 자동생성 · 고사실 자동배정</b><div class="small muted">고사실코드 기준으로 ID를 생성하고 미배정 감독관을 자동 배정합니다.</div></div><div class="actions"><button class="btn" data-action="v201-generate-supervisor-id">ID 자동생성</button><button class="btn btn-primary" data-action="v201-auto-assign">감독관 자동배정</button><button class="btn" data-action="v201-download-assignment">배정리스트 다운로드</button></div></div></section>`:'';const blocked=errors.length>0;return shell(`<div class="v201-context-bar"><div class="field"><label>전형 선택</label>${v201ExamSelect('v201-upload-exam-select')}</div><span class="badge badge-blue">${type==='candidate'?'1단계 · 수험생':'2단계 · 감독관'}</span></div><div class="v201-upload-tabs-note">계정관리 다음 단계입니다. 파일 선택만으로 매칭·검증·조회가 실행되며 오류가 있으면 다음 단계로 이동할 수 없습니다.</div><section class="card">${tabs}<div class="card-body"><div class="v201-upload-grid"><div><div class="dropzone"><div class="drop-icon">📄</div><div class="card-title">${title} 엑셀파일 선택</div><p class="muted">예시 오류가 포함된 양식을 다운로드해 실제 검증 흐름을 확인할 수 있습니다.</p><input type="file" id="excel-file" accept=".xlsx,.xls,.csv" hidden><div class="v201-upload-actions"><button class="btn btn-primary" data-action="choose-excel">파일 선택</button><button class="btn" data-action="download-template" data-template-type="${type}">⇩ ${title} 예시양식</button><button class="btn" data-action="v201-load-example" data-upload-type="${type}">예시데이터 바로보기</button></div></div>${auto}</div><div><div class="card-title">${title} 업로드 컬럼</div><div class="mapping-grid" style="margin-top:10px"><div class="head">엑셀 컬럼</div><div class="head">시스템 조회값</div><div class="head">검증</div>${mapping.map((c,i)=>`<div>${c}</div><div>${c}</div><div><span class="badge ${i<9?'badge-blue':'badge-gray'}">${i<9?'필수':'선택'}</span></div>`).join('')}</div></div></div><div class="v201-upload-errors">${v201ErrorPanel(type)}</div>${rows.length?`<section class="v201-upload-query"><div class="card-header"><div><div class="card-title">${title} 업로드 조회</div><div class="card-sub">읽기 전용 · 각 컬럼에서 필터·정렬 가능 · 수정은 재업로드로만 처리</div></div><span class="v201-readonly-badge">🔒 원본 수정 불가</span></div><div class="card-body"><div class="v201-query-toolbar"><div class="field"><label>전체 검색</label><input class="input v201-upload-type-search" data-target-type="${type}" placeholder="이름, 고사실, 교시, ID 검색"></div><span class="badge badge-green">${rows.length}행</span></div>${v201RowsTable(type,rows)}</div></section>`:''}<div class="v201-step-block"><span class="small ${blocked?'text-red':'muted'}">${blocked?'오류를 수정해야 다음 단계로 이동할 수 있습니다.':'검증 완료 · 설정값으로 이동할 수 있습니다.'}</span><button class="btn btn-primary" data-route="settings-features" ${blocked?'disabled':''}>다음 단계 · 설정값</button></div></div></section>${v201DerivedPanel()}`,'업로드·자동검증',`${title} 기초데이터를 업로드하고 피벗형 조회정보를 자동 생성합니다.`,'');};
  processExcel=async function(file){const type=state.ui.uploadType||'candidate';let rows=[];try{const ready=await ensureXlsx();if(ready){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});}}catch(e){console.warn(e);}if(!rows.length)rows=type==='candidate'?v201SampleCandidateRows():v201SampleInvigilatorRows();if(type==='invigilator')rows=v201GenerateSupervisorIds(rows);state.uploadRows[type]=rows;state.uploadErrors[type]=v201ValidateRows(type,rows);state.uploadFileNames[type]=file.name||'예시파일.xlsx';state.uploads[type]={name:state.uploadFileNames[type],total:rows.length,errors:state.uploadErrors[type]};save();render();toast(state.uploadErrors[type].length?`오류 ${state.uploadErrors[type].length}건을 화면에 표시했습니다.`:'업로드 검증이 완료되었습니다.',state.uploadErrors[type].length?'warning':'success');};

  downloadTemplate=async function(type){if(type==='candidate'){v201DownloadBase64(V201_CANDIDATE_XLSX,'수험생_업로드_예시양식_v2.0.1.xlsx');toast('정상/오류 예시가 포함된 수험생 양식을 다운로드합니다.','success');return;}if(type==='invigilator'){v201DownloadBase64(V201_INVIGILATOR_XLSX,'감독관_업로드_예시양식_v2.0.1.xlsx');toast('자동ID/무배정/역할오류 예시가 포함된 감독관 양식을 다운로드합니다.','success');return;}if(type==='account'){const rows=[{아이디:'exam02',이름:'홍길동',역할:roleDisplayName('exam'),메모:'수시논술 운영총괄','장소 안내 사용':'미사용','안내 장소':'',상태:'사용'},{아이디:'middle02',이름:'김관리',역할:roleDisplayName('middle'),메모:'연극실기 현장지원','장소 안내 사용':'사용','안내 장소':'본교 제1고사장|학림관',상태:'사용'}];const ready=await ensureXlsx();if(ready){const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'계정업로드');XLSX.writeFile(wb,'대학관리자_계정_업로드_양식_v2.0.1.xlsx');return;}}return v201OriginalDownloadTemplate(type);};

  processExcel=async function(file){
    const type=state.ui.uploadType||'candidate',name=file.name||'업로드파일.xlsx';
    if(name.includes('정상')){
      state.uploadRows[type]=type==='candidate'?v202CandidateRows('normal'):v202InvigilatorRows('normal');state.uploadErrors[type]=[];
    }else if(name.includes('오류')){
      state.uploadRows[type]=type==='candidate'?v202CandidateRows('error'):v202InvigilatorRows('error');state.uploadErrors[type]=v202ExampleErrors(type,'error');
    }else{
      let rows=[];try{const ready=await ensureXlsx();if(ready){const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});}}catch(e){console.warn(e);}if(!rows.length)rows=type==='candidate'?v202CandidateRows('error'):v202InvigilatorRows('error');if(type==='invigilator')rows=v201GenerateSupervisorIds(rows);state.uploadRows[type]=rows;state.uploadErrors[type]=v201ValidateRows(type,rows);
    }
    state.uploadFileNames[type]=name;state.ui.uploadExampleMode[type]=name.includes('정상')?'normal':name.includes('오류')?'error':'custom';save();render();
  };

    if(state.features.allowUnassignedInvigilator&&c.length&&i.length){const rooms=new Set(c.map(r=>v206Get(r,['고사실코드','고사실'])).filter(Boolean)).size;const ids=new Set(i.map(r=>v206Get(r,['감독관ID'])).filter(Boolean)).size;if(rooms!==ids)errors.push({row:'운영정책',column:'감독관 수',value:`고사실 ${rooms}실 · 감독관ID ${ids}개`,message:'고사실 무배정 운영에서는 고사실 수와 공용 감독관 ID 수가 같아야 합니다.',solution:'고사실별 공용 ID를 1개씩 생성하세요.',source:'v207'});}
    return errors;
  }
  function v207ApplyCrossErrors(){['candidate','invigilator','photos'].forEach(t=>state.uploadErrors[t]=(state.uploadErrors[t]||[]).filter(e=>e.source!=='v207'));const cross=v207CrossErrors();if(cross.length){const target=state.uploadRows.candidate?.length?'candidate':state.uploadRows.invigilator?.length?'invigilator':'photos';state.uploadErrors[target]=[...(state.uploadErrors[target]||[]),...cross];}}
  const v207UploadBase=uploadPage;

  function v207DataDetailPanel(){const label=state.ui.dataDetail;if(!label)return '';const rows=v207DataDetailRows(label);const isInv=label.includes('감독관')||['정감독관','부감독관','예비감독관','무배정'].includes(label),isPhoto=label.includes('사진');const heads=isInv?['감독관ID','감독관명','구분','교시','고사장','고사실']:isPhoto?['파일명','수험번호','매칭','오류내용']:['수험번호','수험생명','교시','고사장','고사실','사진파일명'];return `<section class="v207-data-detail"><div class="head"><div><b>${esc(label)} 상세 목록</b><div class="small muted">상단 숫자를 선택해 펼친 읽기 전용 목록입니다.</div></div><button class="btn btn-sm" data-action="v207-close-data-detail">닫기</button></div><div class="body"><div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v||'-')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${heads.length}" class="text-center muted">데이터가 없습니다.</td></tr>`}</tbody></table></div></div></section>`;}

  const v207DashboardBase=dashboardPage;
  dashboardPage=function(){let html=v207DashboardBase();if(state.features.allowUnassignedInvigilator){const notice=`<div class="v207-unassigned-banner"><div><b>고사실 무배정 운영</b><div class="small">수험생·감독관을 고사실에 사전 배정하지 않고 건물별 수험번호 범위와 현장 수용인원으로 입장 처리합니다.</div><div class="facts"><span>전체 고사장 예비 운영</span><span>전체 수험생 타고사장 처리</span><span>고사실별 공용 감독관ID 1개</span><span>감독관수 = 고사실수</span></div></div><span class="badge badge-orange">특수 운영</span></div>`;html=html.replace('<div class="toolbar v202-dashboard-toolbar">',notice+'<div class="toolbar v202-dashboard-toolbar">').replace('<div class="toolbar">',notice+'<div class="toolbar">').replaceAll('타고사장 수험생','전체 수험생(타고사장 처리)');}return html;};
  const v207RoomBase=roomListPage;
  roomListPage=function(){let html=v207RoomBase();if(state.features.allowUnassignedInvigilator){const notice=`<div class="v207-unassigned-banner"><div><b>고사실 무배정 운영현황</b><div class="small">고사실은 현장 수용인원 단위로 운영하며 감독관은 고사실별 공용 ID로 로그인합니다.</div><div class="facts"><span>수험번호 범위 기반 입장</span><span>사전 고사실 배정 없음</span><span>공용ID 중복 로그인 허용</span></div></div></div>`;html=html.replace('<div class="toolbar">',notice+'<div class="toolbar">');}return html;};

  const v207BindActionsBase=bindActions;
  bindActions=function(){
    v207BindActionsBase();
    document.querySelectorAll('[data-action="v207-edit-exam"]').forEach(el=>el.addEventListener('click',()=>{const ex=state.exams.find(x=>x.id===el.dataset.examId);if(!ex)return;modal('전형 수정',`<div class="grid grid-2"><div class="field"><label>전형명</label><input class="input" id="v207-exam-name" value="${esc(ex.name)}"></div><div class="field"><label>전형코드</label><input class="input" id="v207-exam-code" value="${esc(ex.code)}"></div><div class="field"><label>시험일</label><input class="input" type="date" id="v207-exam-date" value="${esc(ex.examDate)}"></div><div class="field"><label>단계</label><select class="select" id="v207-exam-status">${['테스트','운영','종료'].map(s=>`<option ${ex.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="v207-exam-save">저장</button>`);setTimeout(()=>document.getElementById('v207-exam-save')?.addEventListener('click',()=>{const old=ex.name;ex.name=document.getElementById('v207-exam-name').value.trim()||ex.name;ex.code=document.getElementById('v207-exam-code').value.trim()||ex.code;ex.examDate=document.getElementById('v207-exam-date').value;ex.status=document.getElementById('v207-exam-status').value;if(state.selection===old)state.selection=ex.name;save();closeModal();render();toast('전형 정보를 수정했습니다.','success');}),0);}));
    document.querySelectorAll('[data-action="v207-toggle-exam"]').forEach(el=>el.addEventListener('click',()=>{const ex=state.exams.find(x=>x.id===el.dataset.examId);if(!ex)return;ex.useStatus=ex.useStatus==='사용중지'?'사용':'사용중지';if(ex.useStatus==='사용중지'&&state.selection===ex.name){const next=v207ActiveExams().find(x=>x.id!==ex.id);if(next){state.selection=next.name;state.ui.pmExamId=next.id;}}save();render();toast(`전형을 ${ex.useStatus} 상태로 변경했습니다.`,'success');}));
    document.querySelectorAll('[data-action="v207-delete-exam"]').forEach(el=>el.addEventListener('click',()=>{const ex=state.exams.find(x=>x.id===el.dataset.examId);if(!ex||!confirm(`${ex.name} 전형을 삭제할까요?`))return;state.exams=state.exams.filter(x=>x.id!==ex.id);const next=v207ActiveExams()[0]||v201ExamList()[0];if(next){state.selection=next.name;state.ui.pmExamId=next.id;}save();render();toast('전형을 삭제했습니다.','success');}));
    document.querySelectorAll('[data-action="v207-save-photo-memo"]').forEach(el=>el.addEventListener('click',()=>{const input=document.getElementById('v207-photo-memo-input'),text=input?.value.trim();if(!text){toast('메모 내용을 입력해주세요.','warning');return;}const id=state.ui.photoCandidate||'21330061';state.photoMemos[id]=state.photoMemos[id]||[];state.photoMemos[id].push({author:`${roleDisplayName(state.session.role)} ${state.session.name}`,role:roleDisplayName(state.session.role),text,at:new Date().toLocaleString('ko-KR')});save();render();toast('현장 메모를 저장했습니다.','success');}));
    document.querySelectorAll('[data-action="v207-show-data-detail"]').forEach(el=>el.addEventListener('click',()=>{state.ui.dataDetail=el.dataset.detail;save();render();setTimeout(()=>document.querySelector('.v207-data-detail')?.scrollIntoView({behavior:'smooth',block:'start'}),0);}));
    document.querySelectorAll('[data-action="v207-close-data-detail"]').forEach(el=>el.addEventListener('click',()=>{state.ui.dataDetail='';save();render();}));
    document.querySelectorAll('[data-action="v207-generate-shared-ids"]').forEach(el=>el.addEventListener('click',()=>{const rooms=[];const seen=new Set();(state.uploadRows.candidate||[]).forEach(r=>{const code=v206Get(r,['고사실코드','고사실 코드','고사실']);const session=v206Get(r,['교시']);if(!code)return;const key=code+'|'+session;if(seen.has(key))return;seen.add(key);rooms.push({code,session,site:v206Get(r,['고사장','시험장']),building:v206Get(r,['건물','건물명']),room:v206Get(r,['고사실'])});});if(!rooms.length){toast('수험생 기초데이터를 먼저 업로드해주세요.','warning');return;}state.uploadRows.invigilator=rooms.map((r,i)=>({'전형명':state.selection,'시험일':state.basic.examDate,'교시':r.session,'시작시간':'','종료시간':'','고사장':r.site,'건물':r.building,'고사실코드':r.code,'고사실':r.room,'감독관ID':`ROOM-${r.code}`,'감독관명':`${r.room||r.code} 공용ID`,'감독관구분':'정감독관','서명사용여부':'Y','로그인방식':'고사실당 1개 ID · 중복로그인 허용','오류내용':'정상'}));state.invigilatorAssignments=v201Deep(state.uploadRows.invigilator);state.uploadFileNames.invigilator='고사실별_공용감독관ID.xlsx';state.uploadErrors.invigilator=[];v207ApplyCrossErrors();save();render();toast(`${rooms.length}개 고사실 공용 ID를 생성했습니다.`,'success');}));
  };

  /* v2.0.8 — 학교별 명칭을 담당 PM 설정값 탭으로 통합 */
  function v208SettingsTermsBody(){
    const terms=[
      ['examSite','고사장','고사장'],
      ['examRoom','고사실','고사실'],
      ['middleManager','중간관리자','복도관리자'],
      ['examManager','전형관리자','입학처 관리자'],
      ['incident','사고자','특이사항 학생']

    const rows=terms.map(([k,base,ph])=>`<div class="v208-term-row"><div><div class="base">${esc(base)}</div><div class="hint">기본 시스템 명칭</div></div><div class="field"><label>변경 명칭</label><input class="input" data-v201-term="${k}" value="${esc(state.terms[k]||base)}" placeholder="${esc(ph)}"></div></div>`).join('');

    return `<div class="v208-terms-head"><div><h3>학교별 명칭</h3><p>선택한 전형에서 사용하는 고사장·고사실·관리자·사고자 명칭을 수정합니다. 저장하면 계정 역할, 왼쪽 메뉴, 표 컬럼, 검색 필터, PDF·각서 문구에 동일하게 반영됩니다.</p></div><span class="badge badge-blue">전형별 저장</span></div><div class="v208-term-layout"><section class="card"><div class="card-header"><div><div class="card-title">명칭 편집</div><div class="card-sub">온·오프 없이 필요한 명칭을 직접 수정합니다.</div></div></div><div class="card-body"><div class="v208-term-list">${rows}</div><div class="v208-save-row"><button class="btn btn-primary" data-action="save-terms">선택 전형 명칭 저장</button></div></div></section><section class="v208-term-preview"><div class="flex justify-between"><div><h3 class="section-title">변경 미리보기</h3><div class="small muted">입력 즉시 “기존 명칭 → 변경 명칭”으로 표시됩니다.</div></div><span class="badge badge-green">실시간</span></div><div class="v208-term-arrow-list">${arrows}</div><div class="v208-preview-frame"><div class="top">예상 화면</div><div class="body"><div class="cell"><b>계정 역할</b><span data-v201-term-preview="examManager">${esc(term('examManager'))}</span> · <span data-v201-term-preview="middleManager">${esc(term('middleManager'))}</span></div><div class="cell"><b>운영 필터</b><span data-v201-term-preview="examSite">${esc(term('examSite'))}</span> / <span data-v201-term-preview="examRoom">${esc(term('examRoom'))}</span></div><div class="cell"><b>메뉴 문구</b><span data-v201-term-preview="incident">${esc(term('incident'))}</span> 관리</div><div class="cell"><b>표 컬럼</b><span data-v201-term-preview="examRoom">${esc(term('examRoom'))}</span> · 응시율</div></div></div></section></div>`;
  }

  const v208SettingsNavOriginal=settingsNav;

    if(tab==='terms'){
      return shell(`<div class="v201-context-bar"><div class="field"><label>전형 선택</label>${v201ExamSelect('v201-settings-exam-select')}</div><span class="badge badge-blue">전형별 설정값</span></div><section class="card">${settingsNav('terms')}<div class="card-body">${v208SettingsTermsBody()}</div></section>`,'설정값 관리',`${state.school.name} · ${state.selection} 기능/학교별 명칭/PDF/각서 설정을 관리합니다.`,`<button class="btn btn-primary" data-action="save-terms">선택 전형 명칭 저장</button>`);

  v207Normalize();

  window.addEventListener('hashchange',()=>{route=location.hash.replace(/^#\/?/,'')||'login';render();});

})();
