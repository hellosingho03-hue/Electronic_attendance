<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>전자출결시스템 관리자 테스트 페이지 v1.6.0</title>
  <style>
:root {
  --navy:#071d42;
  --navy-2:#0c2c5f;
  --blue:#1267d6;
  --blue-2:#eaf3ff;
  --cyan:#0d9bb8;
  --green:#12a05c;
  --green-soft:#e8f7ef;
  --orange:#f39a18;
  --orange-soft:#fff5df;
  --red:#e43d3d;
  --red-soft:#fff0f0;
  --purple:#7755d9;
  --purple-soft:#f1edff;
  --teal:#0e8f83;
  --teal-soft:#e8f8f6;
  --gray-900:#172033;
  --gray-800:#263247;
  --gray-700:#46536a;
  --gray-600:#657187;
  --gray-500:#8791a4;
  --gray-400:#b6bfce;
  --gray-300:#d8dee8;
  --gray-200:#e8edf4;
  --gray-100:#f4f7fb;
  --white:#fff;
  --shadow:0 10px 30px rgba(12,44,95,.08);
  --radius:16px;
  --sidebar:244px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef3f9;color:var(--gray-900)}
body{font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--gray-600)}
.small{font-size:12px}
.tiny{font-size:11px}
.strong{font-weight:800}
.nowrap{white-space:nowrap}
.text-right{text-align:right}
.text-center{text-align:center}
.flex{display:flex}
.flex-1{flex:1}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Login */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:linear-gradient(145deg,#061c41 0%,#0b3a7a 55%,#1267d6 100%)}
.login-hero{position:relative;overflow:hidden;padding:70px 72px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
.login-hero:before{width:520px;height:520px;right:-160px;top:-110px}
.login-hero:after{width:360px;height:360px;right:90px;bottom:-210px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;letter-spacing:-.5px}
.brand-mark{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.hero-copy{max-width:680px;position:relative;z-index:1}
.hero-copy h1{font-size:52px;line-height:1.12;margin:0 0 22px;letter-spacing:-2px}
.hero-copy p{font-size:18px;line-height:1.75;color:rgba(255,255,255,.82);margin:0;max-width:620px}
.hero-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:34px}
.hero-step{padding:13px 10px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-size:12px;text-align:center}
.hero-step b{display:block;font-size:15px;margin-bottom:3px}
.login-panel{background:#f7f9fc;padding:48px;display:flex;align-items:center;justify-content:center}
.login-card{width:min(470px,100%);background:#fff;border:1px solid var(--gray-200);border-radius:26px;padding:38px;box-shadow:0 24px 70px rgba(1,19,48,.18)}
.login-card h2{font-size:28px;margin:0 0 8px;letter-spacing:-.8px}
.login-card .lead{margin:0 0 26px;color:var(--gray-600)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:750;font-size:13px;color:var(--gray-800)}
.input,.select,.textarea{width:100%;border:1px solid var(--gray-300);background:#fff;border-radius:10px;padding:11px 13px;color:var(--gray-900);outline:none;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,103,214,.12)}
.textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--gray-300);background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;color:var(--gray-800);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(28,45,78,.08)}
.btn-primary{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-soft{background:var(--gray-100)}
.btn-ghost{background:transparent}
.btn-sm{min-height:32px;padding:6px 10px;font-size:12px;border-radius:8px}
.btn-lg{min-height:48px;padding:12px 18px;font-size:15px}
.btn-block{width:100%}
.demo-box{margin-top:22px;background:var(--gray-100);border-radius:13px;padding:14px;border:1px solid var(--gray-200)}
.demo-title{font-size:12px;font-weight:800;margin-bottom:8px;color:var(--gray-700)}
.demo-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.demo-account{border:1px solid var(--gray-300);background:#fff;border-radius:8px;padding:8px 10px;text-align:left;font-size:12px}
.demo-account b{display:block;color:var(--navy-2);margin-bottom:2px}

/* App shell */
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:64px 1fr}
.topbar{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.topbar .brand{font-size:18px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900}
.sidebar{grid-row:2;background:#0b244b;color:#d9e8ff;padding:18px 14px 28px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.role-panel{border-radius:13px;padding:12px;margin-bottom:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.role-panel .role-name{font-weight:900;color:#fff;margin-bottom:3px}
.role-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.role-developer{--role:var(--purple);--role-soft:var(--purple-soft)}
.role-pm{--role:var(--blue);--role-soft:var(--blue-2)}
.role-exam{--role:var(--green);--role-soft:var(--green-soft)}
.role-building{--role:var(--orange);--role-soft:var(--orange-soft)}
.role-field{--role:var(--teal);--role-soft:var(--teal-soft)}
.nav-group{margin:14px 0 5px;padding:0 10px;font-size:11px;color:#7ea2d7;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.nav-item{width:100%;border:0;color:#c9dbf5;background:transparent;border-radius:10px;padding:10px 11px;display:flex;align-items:center;gap:10px;text-align:left;margin:3px 0;font-weight:700}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--role,var(--blue));color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.18)}
.nav-icon{width:22px;text-align:center;font-size:16px}
.content{grid-column:2;grid-row:2;padding:24px 26px 44px;min-width:0}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.page-title h1{margin:0;font-size:27px;letter-spacing:-.9px}
.page-title p{margin:7px 0 0;color:var(--gray-600)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* components */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:17px 18px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
.card-sub{font-size:12px;color:var(--gray-600);margin-top:3px}
.card-body{padding:18px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:16px;background:#fff;border:1px solid var(--gray-200);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.kpi .label{font-size:12px;font-weight:800;color:var(--gray-700)}
.kpi .value{font-size:26px;font-weight:950;line-height:1.15;margin-top:4px;white-space:nowrap}
.kpi .value small{font-size:12px;font-weight:700;margin-left:3px}
.kpi-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:850;white-space:nowrap;border:1px solid transparent}
.badge-blue{background:var(--blue-2);color:var(--blue)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-orange{background:var(--orange-soft);color:#d77d00}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-gray{background:var(--gray-100);color:var(--gray-600);border-color:var(--gray-200)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.section-title{font-size:18px;font-weight:900;margin:0 0 12px;letter-spacing:-.4px}
.toolbar{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:13px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar .field{min-width:145px;flex:1}
.toolbar .field.narrow{min-width:120px;max-width:180px}
.toolbar .field.wide{min-width:220px}
.table-wrap{overflow:auto;border:1px solid var(--gray-200);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 12px;border-bottom:1px solid var(--gray-200);text-align:left;vertical-align:middle}
th{background:#f5f8fc;color:var(--gray-700);font-size:12px;font-weight:900;white-space:nowrap;position:sticky;top:0;z-index:2}
td{font-size:12px;color:var(--gray-800)}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fbfdff}
tr.closed td{background:#eef1f5!important;color:#7a8497}
.progress{height:8px;background:#e8edf4;border-radius:999px;overflow:hidden;min-width:80px}
.progress > span{display:block;height:100%;background:var(--green);border-radius:999px}
.progress.orange > span{background:var(--orange)}
.progress.red > span{background:var(--red)}
.progress.blue > span{background:var(--blue)}
.notice{border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.notice-info{background:#edf5ff;border-color:#cbe0ff;color:#174f9e}
.notice-success{background:var(--green-soft);border-color:#bfe8d1;color:#117545}
.notice-warning{background:var(--orange-soft);border-color:#ffd891;color:#8b5b06}
.notice-danger{background:var(--red-soft);border-color:#ffc7c7;color:#a52626}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}
.step{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:12px;display:flex;align-items:center;gap:9px;position:relative;min-width:0}
.step.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(18,103,214,.08)}
.step.done{background:#f0fbf5;border-color:#c7ebd6}
.step-num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gray-200);font-weight:900;color:var(--gray-700);flex:0 0 auto}
.step.active .step-num{background:var(--blue);color:#fff}.step.done .step-num{background:var(--green);color:#fff}
.step-label{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* settings */
.setting-row{display:grid;grid-template-columns:1.25fr 1.8fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--gray-200)}
.setting-row:last-child{border-bottom:0}
.setting-name{font-weight:850}
.setting-desc{font-size:12px;color:var(--gray-600)}
.switch{position:relative;width:48px;height:26px;display:inline-block}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#b9c1ce;border-radius:999px;transition:.2s}
.switch span:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:after{transform:translateX(22px)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--gray-200);padding:0 18px;background:#fff;border-radius:14px 14px 0 0;overflow:auto}
.tab{border:0;background:transparent;padding:13px 12px;color:var(--gray-600);font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.term-preview{background:linear-gradient(135deg,#eef5ff,#f9fbff);border:1px solid #d8e7fb;border-radius:14px;padding:18px}
.term-token{display:flex;gap:8px;align-items:center;margin:7px 0}
.term-token .from{min-width:110px;color:var(--gray-600)}
.term-token .to{font-weight:900;color:var(--blue)}

/* Upload */
.dropzone{border:2px dashed #a8c7ef;background:#f6faff;border-radius:16px;padding:28px;text-align:center;transition:.15s}
.dropzone.drag{border-color:var(--blue);background:#eaf3ff}
.dropzone .drop-icon{font-size:34px;margin-bottom:8px}
.validation-pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.validation-stage{border:1px solid var(--gray-200);background:#fff;border-radius:11px;padding:10px;text-align:center;font-size:12px;font-weight:800}
.validation-stage.running{border-color:var(--blue);color:var(--blue);background:var(--blue-2)}
.validation-stage.ok{border-color:#bde8cf;color:var(--green);background:var(--green-soft)}
.validation-stage.error{border-color:#ffc7c7;color:var(--red);background:var(--red-soft)}
.mapping-grid{display:grid;grid-template-columns:1fr 1fr 110px;gap:0;border:1px solid var(--gray-200);border-radius:12px;overflow:hidden}
.mapping-grid>div{padding:10px 12px;border-right:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);font-size:12px}
.mapping-grid>div:nth-child(3n){border-right:0}
.mapping-grid .head{background:#f5f8fc;font-weight:900;color:var(--gray-700)}
.mapping-grid>div:nth-last-child(-n+3){border-bottom:0}
.result-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.result-box{border:1px solid var(--gray-200);border-radius:12px;padding:12px;text-align:center;background:#fff}
.result-box b{font-size:23px;display:block}
.error-link{color:var(--red);font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* dashboard */
.dashboard-grid{display:grid;grid-template-columns:1.08fr 1.38fr 1fr;gap:14px}
.chart-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:16px;min-width:0}
.chart-title{font-size:14px;font-weight:900;margin-bottom:12px}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;min-height:210px}
.donut{width:164px;height:164px;border-radius:50%;background:conic-gradient(var(--green) 0 56%, var(--red) 56% 100%);position:relative;flex:0 0 auto}
.donut:after{content:"";position:absolute;inset:33px;border-radius:50%;background:#fff}
.donut-label{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:12px;color:var(--gray-600)}
.donut-label b{font-size:28px;color:var(--gray-900);display:block;line-height:1.1}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.segment-bar{display:flex;height:138px;border-radius:14px;overflow:hidden;margin-top:16px}
.segment{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:900;min-width:42px}
.segment small{display:block;font-size:11px;font-weight:700;margin-top:2px}
.room-rank{display:flex;flex-direction:column;gap:9px}
.rank-row{display:grid;grid-template-columns:minmax(115px,1fr) 1.4fr 50px;gap:9px;align-items:center;font-size:12px}
.line-chart{height:210px;position:relative;border-left:1px solid var(--gray-300);border-bottom:1px solid var(--gray-300);background:repeating-linear-gradient(to top,transparent 0,transparent 41px,#edf0f5 42px)}
.line-chart svg{width:100%;height:100%;overflow:visible}
.line-chart-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--gray-500);margin-top:6px}
.incident-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.incident-card{display:flex;align-items:center;gap:10px;border:1px solid var(--gray-200);border-radius:12px;padding:12px;background:#fff;min-width:0}
.incident-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.incident-card b{font-size:19px;display:block}

/* PDF */
.pdf-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.align-buttons{display:flex;gap:5px}
.align-btn{width:34px;height:30px;border:1px solid var(--gray-300);background:#fff;border-radius:7px;font-weight:900}
.align-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.preview-sheet{background:#f1f3f6;padding:18px;border-radius:14px;min-height:610px;display:flex;align-items:center;justify-content:center}
.paper{width:100%;max-width:570px;aspect-ratio:1/1.414;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.13);padding:28px;display:flex;flex-direction:column}
.paper-title{text-align:center;font-size:18px;font-weight:900;margin:12px 0 16px}
.paper-meta{display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px}
.paper-table{width:100%;border-collapse:collapse;min-width:0}
.paper-table th,.paper-table td{border:1px solid #555;padding:4px;font-size:8px;background:#fff;color:#111;position:static}
.paper-footer{margin-top:auto;border-top:1px solid #ddd;padding-top:12px;font-size:10px;display:grid;gap:8px}
.signer-list{max-height:220px;overflow:auto;border:1px solid var(--gray-200);border-radius:10px}
.signer-row{display:grid;grid-template-columns:26px 1fr 100px 100px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--gray-200);font-size:12px}
.signer-row:last-child{border-bottom:0}

/* Modal / toast */
.modal-backdrop{position:fixed;inset:0;background:rgba(7,23,52,.56);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0;font-size:18px}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px}
.close-x{width:32px;height:32px;border:0;border-radius:8px;background:var(--gray-100);font-size:18px}
.toast-root{position:fixed;right:22px;bottom:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border:1px solid var(--gray-200);border-left:5px solid var(--blue);box-shadow:0 14px 36px rgba(0,0,0,.15);border-radius:11px;padding:12px 14px;min-width:280px;max-width:420px;animation:slideIn .2s ease}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.warning{border-left-color:var(--orange)}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* responsive */
@media(max-width:1200px){
  :root{--sidebar:210px}
  .grid-6{grid-template-columns:repeat(3,1fr)}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .dashboard-grid>.chart-card:last-child{grid-column:1/3}
  .incident-cards{grid-template-columns:repeat(2,1fr)}
  .pdf-layout{grid-template-columns:1fr}
}
@media(max-width:900px){

.rate-only.high{background:#e8f7ef;color:#0c8b4d;border-color:#bfe8d1}
.rate-only.mid-high{background:#eaf3ff;color:#1267d6;border-color:#cfe0fa}
.rate-only.mid{background:#fff5df;color:#b16d00;border-color:#f5dba6}
.rate-only.low-mid{background:#fff0e7;color:#c35c0a;border-color:#f3c5a7}
.rate-only.low{background:#fff0f0;color:#cf2d2d;border-color:#f0bcbc}
.rate-color-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--gray-200);border-radius:10px;background:var(--gray-100);margin-bottom:10px}
.rate-color-legend .legend-title{font-size:11px;font-weight:900;margin-right:2px}
.rate-color-item{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--gray-700)}
.rate-color-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.reset-code-panel{border:1px solid var(--gray-200);border-radius:12px;padding:12px;background:var(--gray-100);margin-top:12px}
.close-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.close-summary-box{border:1px solid var(--gray-200);border-radius:10px;padding:10px;background:var(--gray-100)}
.close-summary-box span{display:block;font-size:10px;color:var(--gray-600)}
.close-summary-box b{display:block;font-size:18px;margin-top:3px}
.close-confirm-check{display:flex;gap:9px;align-items:flex-start;border:1px solid #cfe0fa;background:var(--blue-2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px}
.close-confirm-check input{margin-top:2px}
.site-filter-select{min-width:210px}
body.dark .feature-compact-row,body.dark .account-upload-hint,body.dark .feature-all-control,body.dark .rate-color-legend,body.dark .reset-code-panel,body.dark .close-summary-box{background:var(--gray-100);border-color:var(--gray-200)}
body.dark .site-summary-strip,body.dark .close-confirm-check{background:#172a45;border-color:#28496f}
@media(max-width:980px){.site-summary-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.site-summary-strip>div:first-child{grid-column:1/3}.close-summary-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.feature-compact-row{grid-template-columns:auto 1fr}.feature-compact-row .setting-desc{grid-column:2}.site-summary-strip{grid-template-columns:1fr}.site-summary-strip>div:first-child{grid-column:auto}.close-summary-grid{grid-template-columns:1fr}}

</style>

  function smartTableCompare(a,b){
    const clean=v=>String(v||'').replace(/,/g,'').replace(/\s*(명|건|개|석|실|%)\s*$/,'').trim();
    const ca=clean(a), cb=clean(b);

    const da=Date.parse(ca.replace(/\./g,'-')), db=Date.parse(cb.replace(/\./g,'-'));

  function enhanceTables(root=document){

      if(table.dataset.filterEnhanced==='2') return;

        const filterBtn=document.createElement('button');
        filterBtn.type='button';filterBtn.className='table-filter-button';filterBtn.title=`${label} 필터`;filterBtn.setAttribute('aria-label',`${label} 필터`);filterBtn.innerHTML='⌄';
        inner.append(sortBtn,filterBtn);th.appendChild(inner);

        sortBtn.addEventListener('click',()=>{
          const current=model.sort?.idx===i?model.sort.dir:null;
          const next=current==='asc'?'desc':current==='desc'?null:'asc';
          model.sort=next?{idx:i,dir:next}:null;
          Array.from(headerRow.querySelectorAll('.table-sort-button')).forEach(btn=>{btn.dataset.sortState='none';btn.querySelector('.table-sort-indicator').textContent='↕';});
          if(next){sortBtn.dataset.sortState=next;sortBtn.querySelector('.table-sort-indicator').textContent=next==='asc'?'↑':'↓';}
          applyTableModel(table);
        });
        filterBtn.addEventListener('click',ev=>{
          ev.stopPropagation();
          openColumnFilter(table,i,label,filterBtn);
        });
      });

      resetBtn.addEventListener('click',()=>{
        model.filters={};model.sort=null;
        Array.from(headerRow.querySelectorAll('.table-sort-button')).forEach(btn=>{btn.dataset.sortState='none';btn.querySelector('.table-sort-indicator').textContent='↕';});

      table.dataset.filterEnhanced='2';

      function applyTableModel(currentTable){
        const m=currentTable._tableModel;
        let rows=m.rows.slice();
        const active=Object.entries(m.filters).filter(([,v])=>normalizeTableText(v));
        rows.forEach(r=>r.style.display='none');
        rows=rows.filter(row=>active.every(([idx,value])=>normalizeTableText(tableCellValue(row.cells[Number(idx)])).includes(normalizeTableText(value))));
        if(m.sort){
          rows.sort((ra,rb)=>{const c=smartTableCompare(tableCellValue(ra.cells[m.sort.idx]),tableCellValue(rb.cells[m.sort.idx]));return m.sort.dir==='asc'?c:-c;});
        }else{

  function openColumnFilter(table,idx,label,anchor){
    closeColumnFilter();
    const model=table._tableModel;if(!model)return;
    const values=[...new Set(model.rows.map(row=>tableCellValue(row.cells[idx])).filter(Boolean))].sort((a,b)=>smartTableCompare(a,b)).slice(0,100);

    document.body.appendChild(pop);
    const rect=anchor.getBoundingClientRect();
    const width=260;let left=Math.min(rect.left,window.innerWidth-width-12);left=Math.max(12,left);
    let top=rect.bottom+6;if(top+260>window.innerHeight)top=Math.max(12,rect.top-250);
    pop.style.left=`${left}px`;pop.style.top=`${top}px`;
    const input=pop.querySelector('.column-filter-text');
    const select=pop.querySelector('.column-filter-values');
    select.addEventListener('change',()=>{if(select.value)input.value=select.value;});
    const apply=()=>{
      const v=input.value.trim();

      const rows=model.rows; const tbody=table.tBodies[0];
      rows.forEach(r=>r.style.display='none');
      const active=Object.entries(model.filters).filter(([,value])=>normalizeTableText(value));
      let visible=rows.filter(row=>active.every(([col,value])=>normalizeTableText(tableCellValue(row.cells[Number(col)])).includes(normalizeTableText(value))));
      if(model.sort)visible.sort((ra,rb)=>{const c=smartTableCompare(tableCellValue(ra.cells[model.sort.idx]),tableCellValue(rb.cells[model.sort.idx]));return model.sort.dir==='asc'?c:-c;});
      else visible.sort((a,b)=>rows.indexOf(a)-rows.indexOf(b));
      visible.forEach(row=>{row.style.display='';tbody.appendChild(row);});
      let empty=tbody.querySelector('.table-filter-empty');
      if(!visible.length){if(!empty){empty=document.createElement('tr');empty.className='table-filter-empty';const td=document.createElement('td');td.colSpan=table.tHead.rows[0].cells.length;td.textContent='선택한 필터 조건에 맞는 데이터가 없습니다.';empty.appendChild(td);tbody.appendChild(empty);}empty.style.display='';}else if(empty)empty.style.display='none';
      const count=table.closest('.table-wrap')?.querySelector('.table-header-count');
      if(count)count.textContent=`${fmt(visible.length)} / ${fmt(rows.length)}건 표시${active.length?` · 필터 ${active.length}개`:''}${model.sort?` · ${model.sort.dir==='asc'?'오름차순':'내림차순'}`:''}`;
    };
    pop.querySelector('.apply').addEventListener('click',apply);
    pop.querySelector('.clear').addEventListener('click',()=>{input.value='';delete model.filters[idx];anchor.classList.remove('active');apply();});
    pop.querySelector('.pop-close').addEventListener('click',closeColumnFilter);
    input.addEventListener('keydown',e=>{if(e.key==='Enter')apply();if(e.key==='Escape')closeColumnFilter();});
    setTimeout(()=>input.focus(),0);
  }

  function uploadPage(){
    const type=state.ui?.uploadType||'candidate';
    const tabs=`<div class="tabs" style="border-radius:14px 14px 0 0"><button class="tab ${type==='candidate'?'active':''}" data-upload-type="candidate">수험생</button><button class="tab ${type==='invigilator'?'active':''}" data-upload-type="invigilator">감독관</button><button class="tab ${type==='photos'?'active':''}" data-upload-type="photos">사진 ZIP</button></div>`;
    if(type==='photos'){
      const u=state.uploads.photos;
      const content=`${stepper(1)}${tabs}<section class="card" style="border-radius:0 0 16px 16px"><div class="card-body"><div class="dropzone" id="photo-upload-drop"><div class="drop-icon">🖼️</div><div class="card-title">수험생 사전 사진 ZIP을 클릭하거나 끌어놓으세요</div><p class="muted">파일 선택 즉시 수험번호.jpg 기준으로 학생정보와 자동 매칭하고 미매칭 파일을 분류합니다.</p><input type="file" id="photo-file" accept=".zip" hidden><button class="btn btn-primary" data-action="choose-photo">사진 ZIP 선택</button></div><div style="margin-top:14px">${u?photoUploadResult(u):'<div class="notice notice-info"><span>ⓘ</span><div>사진 업로드는 학교별 세팅이 아닌 업로드·자동검증 단계에서 처리합니다.</div></div>'}</div></div></section>`;
      return shell(content,'업로드·자동검증','사진 ZIP을 선택하면 학생정보와 자동 매칭하고 오류·미매칭 결과를 팝업으로 확인합니다.','');
    }
    const upload=state.uploads[type];
    const isCandidate=type==='candidate';
    const title=isCandidate?'수험생':'감독관';
    const cols=isCandidate?requiredCandidateColumns():requiredInvigilatorColumns();
    const assignmentRequired=!state.features.allowUnassignedInvigilator;
    const assignmentNote=!isCandidate&&state.features.allowUnassignedInvigilator
      ? `<div class="notice notice-info" style="margin-bottom:12px"><span>ⓘ</span><div><b>${term('examRoom')} 무배정을 허용합니다.</b><br>감독관 ID·이름·역할만 입력해도 등록되며, 무배정·예비감독관도 PDF 서명자로 선택할 수 있습니다.</div></div>`:'';
    const templateButton=`<button class="btn" data-action="download-template" data-template-type="${type}">⇩ ${title} 업로드 양식</button>`;
    const content=`${stepper(1)}${tabs}<section class="card" style="border-radius:0 0 16px 16px"><div class="card-body">${assignmentNote}<div class="grid grid-2"><div><div class="dropzone" id="upload-drop"><div class="drop-icon">📄</div><div class="card-title">${title} 엑셀 파일을 클릭하거나 끌어놓으세요</div><p class="muted">파일 선택만 하면 읽기 → 컬럼 매칭 → 선택 검증 → 오류 분류가 자동 실행되고 결과 팝업이 표시됩니다.</p><input type="file" id="excel-file" accept=".xlsx,.xls,.csv" hidden><div class="upload-title-actions" style="justify-content:center"><button class="btn btn-primary" data-action="choose-excel">파일 선택</button>${templateButton}</div><div class="small muted" style="margin-top:8px">별도의 검증 실행 버튼은 없습니다.</div></div><div class="validation-pipeline" id="validation-pipeline">${['파일 읽기','컬럼 매칭','선택 검증','오류 분류','결과 생성'].map(stage=>`<div class="validation-stage ${upload?'ok':''}">${upload?'✓ ':''}${stage}</div>`).join('')}</div></div><div><div class="card-title">${title} 파일 필수·선택 컬럼</div><p class="small muted">${isCandidate?'교시 시작·종료시간은 파일에 없으면 세팅값으로 자동 보완합니다.':assignmentRequired?`${term('examRoom')} 배정 컬럼까지 필수로 확인합니다.`:`${term('examRoom')} 배정은 선택이며 무배정 감독관을 허용합니다.`}</p><div class="mapping-grid" style="margin-top:10px"><div class="head">엑셀 컬럼</div><div class="head">시스템 필드</div><div class="head">검증</div>${cols.map(c=>`<div>${c.source}</div><div>${c.target}</div><div><span class="badge ${c.required?'badge-blue':'badge-gray'}">${c.required?'필수':c.auto?'자동보완':'선택'}</span></div>`).join('')}</div></div></div><div id="upload-result" style="margin-top:16px">${upload?uploadResult(upload):'<div class="notice notice-info"><span>ⓘ</span><div>파일을 선택하면 자동 매칭 결과와 오류 행이 이 영역과 결과 팝업에 표시됩니다.</div></div>'}</div></div></section>`;
    return shell(content,'업로드·자동검증',`${title} 파일을 선택하는 즉시 컬럼 매칭과 데이터 오류를 함께 확인합니다.`,templateButton);

  function requiredCandidateColumns(){
    return [

  let pendingAccountImport=[];
  async function processAccountExcel(file){
    if(!/\.(xlsx|xls|csv)$/i.test(file.name)){modal('계정 파일 형식 오류','<div class="notice notice-danger"><span>!</span><div><b>엑셀 또는 CSV 파일만 업로드할 수 있습니다.</b><br>계정 양식을 내려받아 작성한 뒤 다시 선택해주세요.</div></div>','<button class="btn" data-close-modal>닫기</button>');return;}
    let rows=[];let headers=[];
    try{
      const hasXlsx=await ensureXlsx();
      if(hasXlsx){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});headers=rows.length?Object.keys(rows[0]):[];}
      else{rows=[{아이디:'exam02',이름:'홍길동',역할:'전형관리자','담당 범위':'2026학년도 수시 논술 전체',상태:'사용'},{아이디:'building02',이름:'김관리',역할:'고사장·건물관리자','담당 범위':'본교 제1고사장 / 학림관',상태:'사용'},{아이디:'field02',이름:'이현장',역할:'현장관리자','담당 범위':'학림관 J402 / 1교시',상태:'사용'}];headers=Object.keys(rows[0]);}
    }catch(e){modal('계정 파일 읽기 오류','<div class="notice notice-danger"><span>!</span><div><b>파일 내용을 읽을 수 없습니다.</b><br>암호 또는 보호가 설정되지 않은 XLSX 양식인지 확인해주세요.</div></div>','<button class="btn" data-close-modal>닫기</button>');return;}
    const required=['아이디','이름','역할','담당 범위','상태'];
    const missing=required.filter(h=>!headers.includes(h));
    const roleMap={'전형관리자':'exam','고사장·건물관리자':'building','고사장관리자':'building','건물관리자':'building','현장관리자':'field'};
    const seen=new Set();const errors=[];const valid=[];
    if(missing.length) missing.forEach(h=>errors.push({row:'헤더',column:h,value:'없음',message:'필수 컬럼이 없습니다.',solution:'배포된 계정 양식의 헤더를 변경하지 마세요.'}));
    rows.forEach((r,i)=>{
      const row=i+2;const id=String(r['아이디']||'').trim();const name=String(r['이름']||'').trim();const roleText=String(r['역할']||'').trim();const scope=String(r['담당 범위']||'').trim();const status=String(r['상태']||'사용').trim();const role=roleMap[roleText];
      if(!id)errors.push({row,column:'아이디',value:'(빈 값)',message:'아이디는 필수입니다.',solution:'영문·숫자 조합의 고유 아이디를 입력하세요.'});
      if(!name)errors.push({row,column:'이름',value:'(빈 값)',message:'이름은 필수입니다.',solution:'관리자 이름을 입력하세요.'});
      if(!role)errors.push({row,column:'역할',value:roleText||'(빈 값)',message:'허용되지 않은 역할입니다.',solution:'전형관리자, 고사장·건물관리자, 현장관리자 중 선택하세요.'});
      if(!scope)errors.push({row,column:'담당 범위',value:'(빈 값)',message:'담당 범위는 필수입니다.',solution:'전형·고사장·건물·고사실 범위를 입력하세요.'});
      if(!['사용','사용중지'].includes(status))errors.push({row,column:'상태',value:status,message:'상태값이 올바르지 않습니다.',solution:'사용 또는 사용중지를 입력하세요.'});
      if(id&&(seen.has(id)||id==='admin'||state.accounts.some(a=>a.id===id)))errors.push({row,column:'아이디',value:id,message:'이미 사용 중인 아이디입니다.',solution:'중복되지 않는 아이디로 변경하세요.'});
      if(id)seen.add(id);
      const rowHasError=errors.some(e=>e.row===row);
      if(!rowHasError)valid.push({id,name,role,scope,status,password:'1234'});
    });
    pendingAccountImport=valid;
    const sample=errors.slice(0,6);
    const notice=errors.length?`<div class="notice notice-warning"><span>!</span><div><b>정상 ${valid.length}건 · 오류 ${errors.length}건을 확인했습니다.</b><br>오류행은 반영하지 않으며 정상행만 선택적으로 등록할 수 있습니다.</div></div>`:`<div class="notice notice-success"><span>✓</span><div><b>${valid.length}개 계정을 정상 검증했습니다.</b><br>확인 버튼을 누르면 대학 관리자 계정 목록에 반영됩니다.</div></div>`;
    const mapping=`<div class="mapping-mini">${required.map(h=>`<div><b>${h}</b>${headers.includes(h)?'정상 매칭':'누락'}</div>`).join('')}<div><b>관리</b>시스템 버튼 자동 생성</div></div>`;
    const errorTable=sample.length?`<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>행</th><th>컬럼</th><th>입력값</th><th>오류 내용</th><th>권장 조치</th></tr></thead><tbody>${sample.map(e=>`<tr><td>${e.row}</td><td><b>${esc(e.column)}</b></td><td>${esc(e.value)}</td><td>${esc(e.message)}</td><td>${esc(e.solution)}</td></tr>`).join('')}</tbody></table></div>`:'';
    modal('대학 관리자 계정 업로드 검증 결과',`<div class="upload-result-modal">${notice}${mapping}${errorTable}<div style="margin-top:12px">${infoRows([['파일',file.name],['전체 데이터',rows.length+'건'],['정상 등록 가능',valid.length+'건'],['초기 비밀번호','1234'],['삭제 정책','삭제 없이 사용중지로 관리']])}</div></div>`,`<button class="btn" data-close-modal>닫기</button>${valid.length?`<button class="btn btn-primary" id="apply-account-import">정상 ${valid.length}건 계정 반영</button>`:''}`);
    setTimeout(()=>document.getElementById('apply-account-import')?.addEventListener('click',()=>{pendingAccountImport.forEach(a=>state.accounts.push(a));state.auditLogs.unshift({at:new Date().toLocaleString('ko-KR'),schoolId:state.school.id,examId:currentExam().id,account:state.session.id,feature:'계정',target:'대학 관리자 계정',action:`엑셀 ${pendingAccountImport.length}건 등록`});save();closeModal();render();toast(`${pendingAccountImport.length}개 계정을 등록했습니다.`,'success');pendingAccountImport=[];}),0);
  }

  function handleLogin(e){

    const account=state.accounts.find(a=>a.id===id);
    if(!account||pw!==(account.password||'1234')){toast('아이디 또는 비밀번호를 확인해주세요.','error');return;}
    if(account.status!=='사용'){toast('사용중지된 계정입니다. 담당 관리자에게 문의해주세요.','error');return;}

  function downloadTemplate(type){
    const t=EMBEDDED_TEMPLATES[type];
    if(!t){toast('다운로드할 양식을 찾지 못했습니다.','error');return;}
    try{
      const raw=atob(t.data); const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([bytes],{type:t.mime}));
      const a=document.createElement('a');a.href=url;a.download=t.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast(`${t.name} 다운로드를 시작했습니다.`,'success');
    }catch(e){toast('양식 다운로드 중 오류가 발생했습니다.','error');}
  }

    modal(`${term('examRoom')} 자동 생성`, `<div class="grid grid-3"><div class="field"><label>${term('examSite')}</label><select class="select" id="gen-site"><option>본교 제1${term('examSite')}</option><option>본교 제2${term('examSite')}</option></select></div><div class="field"><label>건물명</label><input class="input" id="gen-building" value="학림관"></div><div class="field"><label>${term('examRoom')} 접두어</label><input class="input" id="gen-prefix" value="J"></div><div class="field"><label>시작 호실</label><input class="input" id="gen-start" type="number" value="401" min="1"></div><div class="field"><label>종료 호실</label><input class="input" id="gen-end" type="number" value="410" min="1"></div><div class="field"><label>고사실당 정원</label><input class="input" id="gen-capacity" type="number" value="50" min="1"></div><div class="field"><label>코드 시작값</label><input class="input" id="gen-code" type="number" value="12001" min="1"></div></div><div class="room-generator-summary"><div><span class="tiny muted">생성 개수</span><b id="gen-count">10실</b></div><div><span class="tiny muted">시작 고사실</span><b id="gen-first">J401</b></div><div><span class="tiny muted">마지막 고사실</span><b id="gen-last">J410</b></div><div><span class="tiny muted">총 정원</span><b id="gen-total">500명</b></div></div><div class="generator-preview" id="gen-preview"></div>`, `<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="confirm-room-generation">자동 생성</button>`);
    const ids=['gen-site','gen-building','gen-prefix','gen-start','gen-end','gen-capacity','gen-code'];
    const update=()=>{
      const site=document.getElementById('gen-site')?.value||'';const building=document.getElementById('gen-building')?.value.trim()||'';const prefix=document.getElementById('gen-prefix')?.value.trim()||'';const start=Number(document.getElementById('gen-start')?.value||0);const end=Number(document.getElementById('gen-end')?.value||0);const capacity=Number(document.getElementById('gen-capacity')?.value||0);const code=Number(document.getElementById('gen-code')?.value||0);const count=Math.max(0,end-start+1);document.getElementById('gen-count').textContent=`${count}실`;document.getElementById('gen-first').textContent=`${prefix}${start}`;document.getElementById('gen-last').textContent=`${prefix}${end}`;document.getElementById('gen-total').textContent=`${fmt(count*capacity)}명`;const preview=Array.from({length:Math.min(count,6)},(_,i)=>({site,building,room:`${prefix}${start+i}`,code:String(code+i),capacity}));document.getElementById('gen-preview').innerHTML=`<table><thead><tr><th>${term('examSite')}</th><th>건물</th><th>코드</th><th>${term('examRoom')}</th><th>정원</th></tr></thead><tbody>${preview.map(r=>`<tr><td>${esc(r.site)}</td><td>${esc(r.building)}</td><td>${r.code}</td><td><b>${esc(r.room)}</b></td><td>${r.capacity}</td></tr>`).join('')}${count>6?`<tr><td colspan="5" class="text-center muted">외 ${count-6}실</td></tr>`:''}</tbody></table>`;return {site,building,prefix,start,end,capacity,code,count};
    };
    ids.forEach(id=>document.getElementById(id)?.addEventListener('input',update));document.getElementById('gen-site')?.addEventListener('change',update);update();
    document.getElementById('confirm-room-generation')?.addEventListener('click',()=>{const v=update();if(!v.building||!v.prefix||v.count<1||v.count>100||v.capacity<1){toast('건물, 접두어, 호실 범위와 정원을 확인해주세요.','error');return;}const newRows=Array.from({length:v.count},(_,i)=>({site:v.site,building:v.building,code:String(v.code+i),room:`${v.prefix}${v.start+i}`,capacity:v.capacity,status:'사용'}));state.generatedRooms=[...(state.generatedRooms||[]),...newRows];save();closeModal();render();toast(`${newRows.length}개 ${term('examRoom')}을 자동 생성했습니다.`,'success');});
  }

  function openErrorModal(i){
    const current=state.uploads[state.ui?.uploadType||'candidate']; const e=current?.errors[i]; if(!e)return;
    modal('업로드 오류 상세',`<div class="notice ${e.level==='오류'?'notice-danger':'notice-warning'}"><span>!</span><div><b>${e.message}</b><br>${e.row}행의 ${e.column} 값을 확인하세요.</div></div><div style="margin-top:14px">${infoRows([['원본 파일',current.name],['시트','Sheet1'],['행',e.row+'행'],['오류 컬럼',e.column],['입력값',e.value],['예상 기준값',e.expected],['권장 조치',e.solution]])}</div>`,`<button class="btn" data-close-modal>닫기</button><button class="btn btn-primary" data-close-modal>원본 수정 후 다시 선택</button>`);

  function showValidationSuccess(u){ modal('검증 완료',`<div class="notice notice-success"><span>✓</span><div><b>모든 데이터가 정상 매칭되었습니다.</b><br>${fmt(u.total)}행을 운영 데이터로 반영할 수 있습니다.</div></div>${infoRows([['파일',u.name],['정상 매칭',fmt(u.ok)+'행'],['컬럼 매칭',u.matched+'개'],['다음 단계','운영 데이터 반영']])}`,`<button class="btn" data-close-modal>닫기</button><button class="btn btn-green" data-close-modal>운영 데이터 반영</button>`); }
  function openAccountModal(){

  function openAccountEditModal(accountId){

    modal('계정 수정',`<div class="grid grid-2"><div class="field"><label>아이디</label><input class="input" id="edit-account-id" value="${esc(account.id)}"></div><div class="field"><label>이름</label><input class="input" id="edit-account-name" value="${esc(account.name)}"></div><div class="field"><label>역할</label><select class="select" id="edit-account-role">${roles.map(r=>`<option value="${r}" ${account.role===r?'selected':''}>${ROLES[r].name}</option>`).join('')}</select></div><div class="field"><label>담당 범위</label><input class="input" id="edit-account-scope" value="${esc(account.scope)}"></div></div><div class="notice notice-warning" style="margin-top:14px"><span>!</span><div>아이디를 변경하면 다음 로그인부터 새 아이디를 사용합니다. 과거 로그는 동일 계정 이력으로 연결합니다.</div></div>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="save-account-edit">저장</button>`);

  function addStandby(){ modal('예비감독관 추가',`<div class="grid grid-2"><div class="field"><label>감독관 ID</label><input class="input" value="S100"></div><div class="field"><label>이름</label><input class="input" placeholder="예비감독관 이름"></div></div><div class="notice notice-info" style="margin-top:14px"><span>ⓘ</span><div>예비감독관은 고사실 미배정 상태로 등록되며 PDF 서명 가능자 목록에서 별도 선택할 수 있습니다.</div></div>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" data-close-modal>추가</button>`); }
  function openIncidentModal(){ modal('특이사항 상세',`${infoRows([['수험번호','21330061'],['성명','김하늘'],['고사실','학림관 J411'],['유형','신분증 미소지'],['발생시각','10:02'],['등록자','현장관리자 최유진']])}<div class="field" style="margin-top:14px"><label>처리 메모</label><textarea class="textarea">현장 사진 촬영 완료. 사전 사진과 비교 필요.</textarea></div>`,`<button class="btn" data-close-modal>닫기</button><button class="btn" data-route="photo-compare" data-close-modal>사진 비교</button><button class="btn btn-primary" data-close-modal>처리 완료</button>`); }

      ['학림관 J414','1교시','출결 완료','서명 완료','마감 전'],
      ['학림관 J409','1교시','출결 완료','서명 완료','마감 전'],

    modal('전형 마감 전 최종 확인',`<div class="notice notice-warning"><span>!</span><div><b>마감 후에는 운영 입력이 잠깁니다.</b><br>고사실별 마감현황과 필수 확인값을 검토한 뒤 확인 버튼을 눌러주세요.</div></div><div class="close-summary-grid"><div class="close-summary-box"><span>전체 고사실</span><b>271실</b></div><div class="close-summary-box"><span>마감 완료</span><b style="color:var(--green)">269실</b></div><div class="close-summary-box"><span>마감 전</span><b style="color:var(--orange)">2실</b></div><div class="close-summary-box"><span>확인 필요</span><b>0실</b></div></div>${infoRows([['출결 처리','15,928 / 15,928명'],['특이사항','60건 · 미확인 0건'],['감독관 서명','271 / 271실'],['답안지 인계',state.features.answerSheet?'271 / 271실':'미사용'],['실행 권한',roleInfo().name+' '+state.session.name]])}<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>고사실</th><th>교시</th><th>출결</th><th>서명</th><th>현재 상태</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="badge badge-green">${r[2]}</span></td><td><span class="badge badge-green">${r[3]}</span></td><td><span class="badge ${r[4]==='마감 완료'?'badge-gray':'badge-blue'}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><label class="close-confirm-check"><input type="checkbox" id="close-confirm-check"><span><b>현재 마감현황과 운영 입력 잠금 범위를 확인했습니다.</b><br>확인 후 마감을 실행하면 결과파일과 PDF 생성 단계로 이동할 수 있습니다.</span></label>`,`<button class="btn" data-close-modal>취소</button><button class="btn btn-primary" id="confirm-close-final" disabled>확인 후 마감</button>`);
    setTimeout(()=>{const check=document.getElementById('close-confirm-check');const btn=document.getElementById('confirm-close-final');if(!check||!btn)return;check.addEventListener('change',()=>btn.disabled=!check.checked);btn.addEventListener('click',finalizeExamClose);},0);
  }
  function reopenExam(){ state.close.status='before';state.close.closedAt=null;save();render();toast('마감을 해제했습니다. 변경 후 자동검증과 마감을 다시 진행하세요.','warning'); }
  function ensureXlsx(timeoutMs=2500){
    if(window.XLSX) return Promise.resolve(true);
    if(window.__xlsxLoading) return window.__xlsxLoading;
    window.__xlsxLoading=new Promise(resolve=>{
      const script=document.createElement('script');
      let settled=false;
      const finish=(ok)=>{if(settled)return;settled=true;resolve(ok);};
      script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      script.async=true; script.onload=()=>finish(!!window.XLSX); script.onerror=()=>finish(false);
      document.head.appendChild(script);
      setTimeout(()=>finish(!!window.XLSX),timeoutMs);
    });
    return window.__xlsxLoading;
  }
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}

  window.addEventListener('hashchange',()=>{route=location.hash.replace(/^#\/?/,'')||'login';render();});
  render();
})();
