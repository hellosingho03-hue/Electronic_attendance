function menu(){let r=state.session?.role;const common=[['공통','login','로그아웃','logout']];if(r==='developer')return [['개발자','dev-home','홈','🏠'],['개발자','dev-schools','학교등록','🏫'],['개발자','dev-ids','학교별 아이디','🔑'],['개발자','dev-log','로그기록','📜']];if(r==='pm')return [['담당PM','pm-home','운영현황','📊'],['담당PM','accounts','계정관리','👥'],['담당PM','upload','업로드·자동검증','⬆'],['담당PM','settings','설정값','⚙'],['담당PM','terminology','학교별 명칭','✏'],['운영','dashboard','운영대시보드','📈'],['운영','incidents','특이사항/사진','⚠'],['운영','close','마감관리','🔒'],['운영','output','출력','🖨'],['운영','downloads','결과파일·통계','📥']];if(r==='exam')return [['전형관리자','dashboard','운영대시보드','📈'],['전형관리자','accounts','중간관리자 계정','👥'],['전형관리자','incidents','특이사항/사진','⚠'],['전형관리자','close','마감관리','🔒'],['전형관리자','output','출력','🖨'],['전형관리자','downloads','결과파일·통계','📥']];if(r==='middle')return [['중간관리자','mobile','모바일 운영','📱'],['중간관리자','incidents','특이사항','⚠'],['중간관리자','output','출력확인','🖨']];return []}
function shell(title,subtitle,body,actions=''){let role=state.session?.role;return `<div class="layout"><aside class="side"><div class="brand"><span class="brandmark">출</span><span>전자출결<br>관리자</span></div><div class="rolebox"><b>${esc(roles[role]?.label||'공통')}</b><span>${esc(state.session?.name||'로그인 전')}</span><div style="font-size:11px;color:#bcd1f3;margin-top:6px">v${APP_VERSION} · ${BUILD}</div></div>${menu().map(m=>`<div class="nav-group">${m[0]}</div><button class="nav-item ${route===m[1]?'active':''}" data-nav="${m[1]}"><span>${m[3]}</span><span>${m[2]}</span></button>`).join('')}<button class="nav-item" data-act="logout"><span>↩</span><span>로그아웃</span></button></aside><main class="main"><div class="topbar"><div><h1>${title}</h1><div class="subtitle">${subtitle}</div></div><div class="actions">${actions}<button class="btn btn-sm" data-act="reset">초기화</button></div></div>${body}</main></div>`}
function render(){if(!state.session&&route!=='login')route='login';let html='';if(route==='login')html=loginPage();else if(route==='dev-home')html=devHome();else if(route==='dev-schools')html=devSchools();else if(route==='dev-ids')html=devIds();else if(route==='dev-log')html=logPage();else if(route==='pm-home')html=pmHome();else if(route==='accounts')html=accountsPage();else if(route==='terminology')html=terminologyPage();else if(route==='upload')html=uploadPage();else if(route==='settings')html=settingsPage();else if(['dashboard','incidents','close','output','downloads','mobile'].includes(route)){if(state.uploadBlocked&&['dashboard','close','output','downloads'].includes(route))html=blockedPage();else html={dashboard:dashboardPage,incidents:incidentsPage,close:closePage,output:outputPage,downloads:downloadsPage,mobile:mobilePage}[route]()}else html=shell('준비중','화면을 찾을 수 없습니다.','');document.getElementById('app').innerHTML=html;bind()}
function loginPage(){return `<div class="login"><section class="login-left"><div class="brand"><span class="brandmark">출</span><span>전자출결시스템</span></div><div><h1>세팅부터 운영·마감까지<br>한 흐름으로 관리합니다.</h1><p>공통 로그인 후 권한에 따라 개발자, 담당 PM, 전형관리자, 중간관리자 화면으로 자동 분기됩니다.</p><div class="flow"><span>① 학교등록</span><span>② 전형관리</span><span>③ 업로드검증</span><span>④ 운영현황</span><span>⑤ 마감·결과</span></div></div><div style="color:rgba(255,255,255,.68);font-size:12px">Prototype v${APP_VERSION} · Build ${BUILD}</div></section><section class="login-right"><div class="login-card"><h2>관리자 공통 로그인</h2><p class="lead">학교·전형은 로그인 계정의 권한에 따라 자동 적용됩니다.</p><div class="field"><label>아이디</label><input class="input" id="login-id" value="admin"></div><div class="field"><label>비밀번호</label><input class="input" id="login-pw" type="password" value="1234"></div><button class="btn btn-primary btn-block" data-act="login">로그인</button><div class="demo"><b>테스트 계정</b><div class="demo-grid">${Object.entries(roles).map(([k,v])=>`<button class="btn" data-demo="${v.id}"><b>${v.label}</b>&nbsp;${v.id}/1234</button>`).join('')}</div></div><div class="policy-note"><b>공통 사이트 운영 정책</b><br>기본은 공통 사이트·공통 서버를 사용합니다. 학교 측 요청 시 별도 사이트주소 또는 독립 서버를 추가 비용 청구 방식으로 제공할 수 있습니다.</div></div></section></div>`}
function kpi(label,num,unit='',color='blue'){return `<div class="kpi"><div class="label">${label}</div><div class="num" style="color:var(--${color})">${num}<span style="font-size:14px;margin-left:4px">${unit}</span></div></div>`}

function pmHome(){return shell('운영현황','담당 PM은 이 화면에서 전형을 생성·선택·삭제·사용중지합니다.',`${examSelector(true)}<div class="grid grid-4">${kpi('전형 수',state.exams.length,'개')}${kpi('사용 전형',state.exams.filter(e=>e.status==='사용').length,'개','green')}${kpi('업로드 정상',state.uploadBlocked?'차단':'정상','','green')}${kpi('현재 전형',currentExam().name,'','blue')}</div><section class="card" style="margin-top:16px"><div class="card-h"><div><div class="card-title">전형 목록</div><div class="card-sub">예시 전형: 수시논술, 수시실기-연극. 전형 선택 후 모든 화면에 적용됩니다.</div></div></div><div class="card-b"><div class="table-wrap"><table><thead><tr><th>전형명</th><th>시작일</th><th>종료일</th><th>상태</th><th>메모</th><th>관리</th></tr></thead><tbody>${state.exams.map(e=>`<tr><td><b>${e.name}</b></td><td>${dateLabel(e.start,e.start)}</td><td>${dateLabel(e.end,e.end)}</td><td><span class="badge ${e.status==='사용'?'badge-green':'badge-orange'}">${e.status}</span></td><td>${e.memo}</td><td><button class="btn btn-sm" data-select-exam="${e.id}">선택</button></td></tr>`).join('')}</tbody></table></div></div></section>`)}
function accountsPage(){let allowExam=state.session.role==='pm'||state.session.role==='exam';return shell('계정관리','운영범위는 선택값이 아닌 메모 텍스트로 관리합니다.',`<section class="card"><div class="card-h"><div><div class="card-title">대학관리자 계정</div><div class="card-sub">전형관리자와 중간관리자 계정을 관리합니다. 중간관리자 장소안내는 사용자화면 확인용입니다.</div></div><button class="btn btn-primary" data-act="account-modal">+ 계정 생성</button></div><div class="card-b"><div class="table-wrap"><table><thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>메모</th><th>장소안내</th><th>상태</th><th>관리</th></tr></thead><tbody>${state.accounts.map(a=>`<tr><td><b>${a.id}</b></td><td>${a.name}</td><td><span class="badge badge-blue">${a.role==='exam'?'전형관리자':'중간관리자'}</span></td><td>${a.memo}</td><td>${a.role==='middle'?(a.placeGuide?`<span class="badge badge-green">사용</span> ${a.places}`:'미사용'):'-'}</td><td>${a.status}</td><td><button class="btn btn-sm" data-edit-account="${a.id}">수정</button></td></tr>`).join('')}</tbody></table></div></div></section>`)}
function terminologyPage(){return shell('학교별 명칭','명칭 수정은 가능하되 사용/미사용 ON/OFF는 제거했습니다.',`${examSelector()}<section class="card"><div class="card-h"><div><div class="card-title">명칭 수정</div><div class="card-sub">선택한 전형에 적용되는 화면 용어를 저장합니다.</div></div><button class="btn btn-primary" data-act="terms-save">명칭 저장</button></div><div class="card-b grid grid-2">${Object.entries({examSite:'고사장',examRoom:'고사실',examManager:'전형관리자',middleManager:'중간관리자',incident:'특이사항'}).map(([k,l])=>`<div class="field"><label>${l}</label><input class="input" data-term="${k}" value="${esc(state.terms[k])}"></div>`).join('')}</div></section>`)}
function blockedPage(){return shell('운영 단계 차단','업로드 자동검증 오류가 있어 다음 단계로 넘어갈 수 없습니다.',`<div class="notice notice-danger"><b>업로드 오류 확인 필요</b><br>수험생/감독관/사진 업로드 데이터 중 오류가 있습니다. 업로드·자동검증 화면에서 오류 내용을 수정한 뒤 운영 단계로 이동하세요.</div><button class="btn btn-primary" style="margin-top:14px" data-nav="upload">업로드 화면으로 이동</button>`)}
function uploadPage(){let t=state.uploadType;let u=state.upload[t];return shell('업로드·자동검증','계정관리 다음 단계입니다. 파일을 선택하면 같은 화면에서 매칭·오류·조회결과가 표시됩니다.',`${examSelector()}<div class="tabs"><button class="tab ${t==='candidate'?'active':''}" data-uploadtab="candidate">수험생</button><button class="tab ${t==='invigilator'?'active':''}" data-uploadtab="invigilator">감독관</button><button class="tab ${t==='photo'?'active':''}" data-uploadtab="photo">사진 ZIP</button><button class="tab ${t==='pivot'?'active':''}" data-uploadtab="pivot">업로드 조회</button></div>${uploadBody(t,u)}`)}
function uploadBody(t,u){if(t==='pivot')return pivotView();let label=t==='candidate'?'수험생':t==='invigilator'?'감독관':'사진 ZIP';return `<section class="card"><div class="card-h"><div><div class="card-title">${label} 업로드</div><div class="card-sub">오류는 팝업이 아니라 현재 화면 하단에 표시됩니다. 오류가 있으면 다음 단계가 차단됩니다.</div></div><div class="actions"><button class="btn" data-template="${t}">양식 다운로드</button>${t==='invigilator'?'<button class="btn btn-green" data-act="auto-assign">감독관 자동배정</button><button class="btn" data-act="assign-download">배정리스트 다운로드</button>':''}</div></div><div class="card-b"><div class="dropzone"><h3>${label} 파일 선택</h3><p>예시 엑셀(CSV)을 내려받아 업로드하면 기초데이터 조회화면에 자동 반영됩니다.</p><input type="file" id="upload-file" accept=".xlsx,.xls,.csv,.zip" hidden><button class="btn btn-primary" data-act="choose-upload">파일 선택</button></div><div class="pipeline">${['파일읽기','컬럼매칭','자동검증','오류표시','조회반영'].map(s=>`<div class="stage ${u.ok?'ok':''}">${u.ok?'✓ ':''}${s}</div>`).join('')}</div>${u.errors.length?errorPanel(u.errors):successPanel(t,u)}${t==='invigilator'?invigilatorPreview():''}</div></section>`}
function successPanel(t,u){return `<div class="notice notice-success"><b>검증 완료</b><br>${u.name} · ${u.rows}건이 정상 검증되었습니다. 업로드 데이터는 조회 전용이며 이 화면에서 직접 수정할 수 없습니다.</div>`}
function errorPanel(errors){return `<div class="error-panel"><b>오류 내용</b><p>아래 오류가 해결되기 전까지 운영대시보드/마감/출력 단계로 이동할 수 없습니다.</p><div class="table-wrap"><table><thead><tr><th>행</th><th>컬럼</th><th>입력값</th><th>오류내용</th><th>조치</th></tr></thead><tbody>${errors.map(e=>`<tr><td>${e.row}</td><td>${e.col}</td><td>${e.val}</td><td>${e.msg}</td><td>${e.fix}</td></tr>`).join('')}</tbody></table></div></div>`}
function invigilatorPreview(){return `<div class="notice notice-info" style="margin-top:14px"><b>감독관 ID 자동생성</b><br>자동배정 버튼을 누르면 고사실코드 기준으로 INV-고사실코드-순번 형태의 감독관 ID가 생성되고 매칭됩니다.</div>`}
function pivotView(){return `<section class="card"><div class="card-h"><div><div class="card-title">기초데이터 조회</div><div class="card-sub">수험생/감독관 업로드 정보를 피벗테이블처럼 요약해 운영현황 조회 컬럼으로 보여줍니다.</div></div><input class="input search" id="pivot-search" placeholder="전형명, 고사실, 감독관 검색"></div><div class="card-b">${pivotTable()}</div></section>`}
function pivotRows(){return baseCandidate.map((r,i)=>({exam:r[0],session:r[1],date:r[2],time:r[3],site:r[4],building:r[5],room:r[6],roomCode:r[7],assigned:r[8],attended:r[9],absent:r[10],invigilator:r[11],incident:r[12],rate:Math.round(r[9]/r[8]*1000)/10}))}
function pivotTable(rows=pivotRows()){return `<div class="table-wrap"><table><thead><tr><th>전형명</th><th>교시</th><th>날짜</th><th>시간</th><th>고사장</th><th>건물</th><th>고사실</th><th>고사실코드</th><th>배정인원</th><th>응시인원</th><th>응시율</th><th>감독관정보</th><th>특이사항</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.exam}</td><td>${r.session}</td><td>${r.date}</td><td>${r.time}</td><td>${r.site}</td><td>${r.building}</td><td>${r.room}</td><td>${r.roomCode}</td><td>${r.assigned}</td><td>${r.attended}</td><td>${r.rate}%</td><td>${r.invigilator}</td><td>${r.incident}</td></tr>`).join('')}</tbody></table></div>`}
function settingsPage(){let tab=state.settingsTab||'features';return shell('설정값','전형별 선택 후 기능, PDF 편집, 각서편집을 저장합니다.',`${examSelector()}<div class="tabs"><button class="tab ${tab==='features'?'active':''}" data-settab="features">기능</button><button class="tab ${tab==='pdf'?'active':''}" data-settab="pdf">PDF 편집</button>${state.features.pledge?`<button class="tab ${tab==='pledge'?'active':''}" data-settab="pledge">각서편집</button>`:''}</div>${tab==='pdf'?pdfSettings():tab==='pledge'?pledgeSettings():featureSettings()}<div style="margin-top:14px"><button class="btn btn-primary" data-act="settings-save">설정값 저장</button></div>`)}
function featureSettings(){return `<div class="grid grid-2"><section class="card"><div class="card-h"><div><div class="card-title">학교별 기능</div><div class="card-sub">선택한 전형 기준으로 기능을 켜고 끕니다.</div></div></div><div class="card-b">${Object.entries({closing:'교시별 마감',reserve:'예비고사장',splitInvigilator:'정/부감독관',answerSheet:'답안지 통계',photoCompare:'사진비교',remainingSeat:'잔여좌석',pledge:'각서 사용',otherSite:'타고사장 수험생 보기',admissionPhotoConfirm:'입학처 사진확인'}).map(([k,l])=>`<div class="feature-row ${state.features[k]?'on':''}"><label class="switch"><input type="checkbox" data-feature="${k}" ${state.features[k]?'checked':''}><span></span></label><b>${l}</b><small>${featureDesc(k)}</small></div>`).join('')}</div></section><section class="card"><div class="card-h"><div><div class="card-title">사고유형·권한</div><div class="card-sub">감독관/중간관리자 중 하나 또는 둘 다 선택 가능합니다.</div></div><button class="btn btn-sm" data-act="incident-add">+ 유형 추가</button></div><div class="card-b">${state.incidents.map((it,i)=>`<div class="incident-config"><label class="switch"><input type="checkbox" data-incident-use="${i}" ${it.use?'checked':''}><span></span></label><input class="input" data-incident-name="${i}" value="${esc(it.name)}"><label><input type="checkbox" data-inc-auth="${i}:invigilator" ${it.invigilator?'checked':''}> 감독관</label><label><input type="checkbox" data-inc-auth="${i}:middle" ${it.middle?'checked':''}> 중간관리자</label><button class="btn btn-sm" data-incident-remove="${i}">삭제</button></div>`).join('')}</div></section></div>${state.features.otherSite?`<section class="card" style="margin-top:14px"><div class="card-h"><div><div class="card-title">타고사장 수험생 예시</div><div class="card-sub">기능 활성화 시 대시보드와 수험생 전체 엑셀형 조회에 노출됩니다.</div></div><input class="input search" placeholder="수험번호/고사장 검색"></div><div class="card-b"><div class="table-wrap"><table><thead><tr><th>수험번호</th><th>성명</th><th>원 고사장</th><th>이동 고사장</th><th>사유</th><th>확인상태</th></tr></thead><tbody><tr><td>C24501</td><td>정예린</td><td>본교 제1고사장</td><td>예비고사장</td><td>편의지원</td><td>확인</td></tr><tr><td>C24502</td><td>오준서</td><td>본교 제2고사장</td><td>본교 제1고사장</td><td>현장 조정</td><td>대기</td></tr></tbody></table></div></div></section>`:''}`}
function featureDesc(k){return {closing:'전체마감 없이 교시별/고사장별 마감',reserve:'예비고사장 표시 및 필터',splitInvigilator:'감독관 역할 구분',answerSheet:'결과파일 통계로 이동',photoCompare:'특이사항 사진확인',remainingSeat:'대시보드 잔여좌석',pledge:'각서편집 탭 노출',otherSite:'타고사장 수험생 조회',admissionPhotoConfirm:'입학처 확인 상태 관리'}[k]||''}
function pdfSettings(){return `<div class="grid grid-2"><section class="card"><div class="card-h"><div><div class="card-title">PDF 설정</div><div class="card-sub">출력 페이지에 적용됩니다.</div></div></div><div class="card-b"><div class="field"><label>페이지당 학생 수</label><select class="select" id="pdf-page"><option>20</option><option selected>30</option><option>40</option></select></div><div class="field"><label>서명정책</label><select class="select"><option>정감독관만</option><option selected>정·부 감독관 모두</option><option>직접 선택</option><option>서명 미사용</option></select></div><div class="field"><label>하단 문구</label><textarea class="textarea">${state.settings.pdf.footer}</textarea></div></div></section><section class="card"><div class="card-h"><div><div class="card-title">미리보기</div><div class="card-sub">선택값은 우측 출력물에 반영됩니다.</div></div></div><div class="card-b"><div class="pdf-preview"><h2 style="text-align:center">수험생 출결 명부</h2><p>전형: ${currentExam().name}</p><p>페이지당 학생 수: ${state.settings.pdf.pageSize}명</p><table class="pledge-table"><tr><th>수험번호</th><th>성명</th><th>출결</th><th>확인</th></tr><tr><td>C1001</td><td>김하늘</td><td>응시</td><td></td></tr><tr><td>C1002</td><td>이서연</td><td>결시</td><td></td></tr></table><p style="text-align:center;margin-top:30px">${state.settings.pdf.footer}</p><p style="text-align:right">정감독관 김민수 __________</p><p style="text-align:right">부감독관 박지현 __________</p></div></div></section></div>`}
function pledgeSettings(){let inc=state.incidents.find(x=>x.use)||state.incidents[0];let tpl=state.settings.pledges[inc.id]||state.settings.pledges.inc1;return `<div class="grid grid-2"><section class="card"><div class="card-h"><div><div class="card-title">사고유형별 각서 편집</div><div class="card-sub">사고유형마다 제목, 부제, 사진표시, 본문을 별도 저장합니다.</div></div><button class="btn btn-primary" data-act="pledge-save">현재 유형 저장</button></div><div class="card-b"><div class="field"><label>사고유형</label><select class="select" id="pledge-incident">${state.incidents.filter(i=>i.use).map(i=>`<option value="${i.id}">${i.name}</option>`)}</select></div><div class="field"><label>제목</label><input class="input" id="pledge-title" value="${tpl.title}"></div><div class="field"><label>부제</label><input class="input" value="${tpl.subtitle}"></div><div class="field"><label>사진표시여부</label><select class="select"><option ${tpl.photo?'selected':''}>표시</option><option ${!tpl.photo?'selected':''}>미표시</option></select></div><div class="field"><label>각서본문</label><textarea class="textarea">${tpl.body}</textarea></div></div></section><section class="card"><div class="card-h"><div><div class="card-title">각서 미리보기</div><div class="card-sub">전형과 날짜는 본문에서 굵게 보입니다.</div></div><div class="actions"><button class="btn btn-sm">PDF 다운로드</button><button class="btn btn-sm">출력</button></div></div><div class="card-b"><div class="pledge-preview"><div class="pledge-head"><h2>${tpl.title}</h2><div>${tpl.subtitle}</div></div><table class="pledge-table"><tr><th>전형</th><td><b>${currentExam().name}</b></td><th>시험일</th><td><b>${dateLabel(currentExam().start,currentExam().end)}</b></td></tr><tr><th>수험번호</th><td>C1001</td><th>성명</th><td>김하늘</td></tr></table><p style="line-height:1.8;margin-top:18px">본 각서는 <b>${currentExam().name}</b>의 <b>${dateLabel(currentExam().start,currentExam().end)}</b> 시험에 대한 확인 문서입니다.</p><p style="line-height:1.8">${tpl.body}</p><p style="text-align:center;margin-top:40px">서명자 김하늘 &nbsp;&nbsp;&nbsp; 서명 __________</p><p style="text-align:center;margin-top:30px">동국대학교 입학처장 귀하</p></div></div></section></div>`}
function dashboardPage(){let rows=pivotRows();return shell('운영대시보드','그래프형 대시보드입니다. 답안지 현황은 결과파일·통계로 이동했습니다.',`${examSelector()}<div class="toolbar"><div class="field"><label>교시</label><select class="select" id="dash-session"><option>1교시</option><option>2교시</option><option>3교시</option><option>4교시</option></select></div><div class="field"><label>고사장</label><select class="select"><option>전체</option><option>본교 제1고사장</option><option>본교 제2고사장</option><option>예비고사장</option></select></div><button class="btn btn-primary">조회</button><button class="btn" data-nav="room-list">엑셀형 보기</button><button class="btn btn-orange" data-nav="close">교시별 마감</button></div><div class="grid grid-5">${kpi('배정',195,'명')}${kpi('응시',103,'명','green')}${kpi('응시율','52.8','%','blue')}${kpi('특이사항',7,'건','orange')}${state.features.otherSite?kpi('타고사장',2,'명','purple'):''}</div><div class="donuts" style="margin-top:16px"><section class="card"><div class="card-h"><div><div class="card-title">전체 응시율</div></div></div><div class="card-b"><div class="donut"><span>52.8%</span></div></div></section><section class="card"><div class="card-h"><div><div class="card-title">고사실 응시율</div></div></div><div class="card-b"><div class="donut" style="background:conic-gradient(#10a06d 0 35%, #f59e0b 35% 80%, #dc2626 80% 100%)"><span>5실</span></div></div></section><section class="card"><div class="card-h"><div><div class="card-title">우선확인</div><div class="card-sub">사고유형 선택 시 특이사항 화면으로 이동합니다.</div></div></div><div class="card-b"><div class="mini-list">${state.incidents.filter(i=>i.use).map(i=>`<button class="btn" data-incident-go="${i.name}">${i.name} ${i.count}건</button>`).join('')}</div></div></section></div><section class="card" style="margin-top:16px"><div class="card-h"><div><div class="card-title">고사실 진행현황</div><div class="card-sub">기초데이터 업로드를 바탕으로 자동 생성된 조회 정보입니다.</div></div></div><div class="card-b">${pivotTable(rows)}</div></section>`)}
function incidentsPage(){let filter=state.incidentFilter||'전체';let q=state.photoSearch||'';let site=state.siteSearch||'';let rows=students.filter(s=>(filter==='전체'||s.incident===filter)&&(!q||s.id.includes(q)||s.name.includes(q))&&(!site||s.site.includes(site)));return shell('특이사항 / 사진비교','학생별·고사장별 검색 후 입학처 확인 상태를 변경할 수 있습니다.',`<div class="toolbar"><div class="field"><label>사고유형</label><select class="select" id="incident-filter"><option>전체</option>${state.incidents.filter(i=>i.use).map(i=>`<option ${filter===i.name?'selected':''}>${i.name}</option>`)}</select></div><div class="field"><label>학생 검색</label><input class="input" id="photo-search" value="${esc(q)}" placeholder="수험번호/성명"></div><div class="field"><label>고사장 검색</label><input class="input" id="site-search" value="${esc(site)}" placeholder="고사장명"></div><button class="btn btn-primary" data-act="photo-search">검색</button></div><div class="photo-layout"><section class="card"><div class="card-h"><div><div class="card-title">대상자 목록</div><div class="card-sub">학생을 선택하면 사진비교 영역이 변경됩니다.</div></div></div><div class="card-b"><div class="candidate-list">${rows.map(s=>`<div class="candidate-item ${state.selectedPhoto===s.id?'active':''}" data-photo-select="${s.id}"><b>${s.name} · ${s.id}</b><div>${s.site} ${s.room}</div><span class="badge ${s.photo==='확인'?'badge-green':'badge-orange'}">${s.photo}</span></div>`).join('')||'검색 결과 없음'}</div></div></section>${photoCompare()}</div>`)}
function photoCompare(){let s=students.find(x=>x.id===state.selectedPhoto)||students[0];return `<section class="card"><div class="card-h"><div><div class="card-title">수험생 사진비교</div><div class="card-sub">입학처 확인 기능은 설정값에서 선택적으로 사용합니다.</div></div><div class="actions">${state.features.admissionPhotoConfirm?`<button class="btn btn-green" data-act="photo-confirm">입학처 확인</button>`:''}</div></div><div class="card-b"><div class="photo-cards"><div><div class="fake-photo">사전 사진<br>${s.id}</div><p><b>수험생</b> ${s.name}</p><p>${s.site} · ${s.room}</p></div><div><div class="fake-photo">현장 사진<br>${s.actor}</div><p><b>촬영자</b> ${s.actor}</p><p>촬영시각 10:02 · 상태 ${s.photo}</p></div></div><div class="notice notice-info" style="margin-top:14px">감독관과 중간관리자 모두 촬영자로 표시될 수 있습니다. 입학처 확인 버튼을 누르면 상태값이 확인으로 변경됩니다.</div></div></section>`}
function closePage(){let sess=state.closeSession,site=state.closeSite;let rows=Object.entries(state.close[sess]||{});return shell('마감관리','전체 마감은 제거하고 교시별·고사장별 마감을 한 화면에서 처리합니다.',`${examSelector()}<div class="toolbar"><div class="field"><label>교시</label><select class="select" id="close-session">${['1교시','2교시','3교시','4교시'].map(x=>`<option ${x===sess?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>고사장</label><select class="select" id="close-site">${['본교 제1고사장','본교 제2고사장','예비고사장'].map(x=>`<option ${x===site?'selected':''}>${x}</option>`)}</select></div><button class="btn btn-primary" data-act="close-filter">조회</button></div><section class="card"><div class="card-h"><div><div class="card-title">고사장별 마감 현황</div><div class="card-sub">상세내역 버튼은 제거하고 모든 확인 정보를 이 화면에서 제공합니다.</div></div></div><div class="card-b">${rows.map(([s,v])=>`<div class="close-row"><b>${sess}</b><b>${s}</b><div>응시 103명 · 특이사항 7건 · 사진확인 2건 · 출력대기 1건</div><button class="btn ${v==='마감완료'?'':'btn-primary'}" data-close-site="${s}">${v==='마감완료'?'마감완료':'고사장 마감'}</button></div>`).join('')}${state.showCloseConfirm?closeConfirm():''}</div></section>`)}
function closeConfirm(){return `<div class="confirm-panel"><h3>최종 마감 전 확인</h3><p>선택 교시와 고사장의 현재 상태를 한 화면에서 확인한 뒤 마감합니다.</p><div class="grid grid-4">${kpi('고사실',5,'실')}${kpi('미처리',0,'건','green')}${kpi('사진확인대기',2,'건','orange')}${kpi('출력대기',1,'건','purple')}</div><button class="btn btn-primary" style="margin-top:12px" data-act="close-confirmed">확인 후 마감</button><button class="btn" style="margin-top:12px" data-act="close-cancel">취소</button></div>`}
function outputPage(){return shell('출력','담당 PM과 전형관리자 모두 PDF와 각서 출력 권한을 가집니다.',`${examSelector()}<div class="grid grid-2"><section class="card"><div class="card-h"><div><div class="card-title">PDF 출력</div><div class="card-sub">감독관 서명 정책과 페이지당 학생 수를 적용합니다.</div></div></div><div class="card-b"><div class="pdf-preview"><h2>수험생 출결 명부</h2><p>전형: ${currentExam().name}</p><p>출력구분: PDF</p><p style="margin-top:260px;text-align:right">감독관 __________</p></div><button class="btn btn-primary">PDF 다운로드</button><button class="btn">출력</button></div></section><section class="card"><div class="card-h"><div><div class="card-title">각서 출력</div><div class="card-sub">사고유형별 각서 템플릿을 적용합니다.</div></div></div><div class="card-b"><div class="pledge-preview"><div class="pledge-head"><h2>신분증 미소지 확인서</h2></div><p><b>${currentExam().name}</b> · <b>${dateLabel(currentExam().start,currentExam().end)}</b></p><p>본인은 사고 내용을 확인하고 대학의 절차에 협조합니다.</p><p style="margin-top:220px;text-align:center">서명자 __________</p></div><button class="btn btn-primary">각서 PDF 다운로드</button><button class="btn">출력</button></div></section></div>`)}
function downloadsPage(){let stat=state.selectedStat;let rows=statRows(stat);return shell('결과파일·통계','전형 선택 후 전체 파일 다운로드와 통계 조회를 수행합니다.',`${examSelector()}<section class="card"><div class="card-h"><div><div class="card-title">결과파일 다운로드</div><div class="card-sub">최상단 전형 선택 기준으로 산출물을 다운로드합니다.</div></div><button class="btn btn-primary" data-act="download-all">전체 결과파일 다운로드</button></div><div class="card-b"><div class="grid grid-3">${resultFiles.map(f=>`<label class="notice"><input type="checkbox" checked> <span>${f}</span></label>`).join('')}</div></div></section><section class="card" style="margin-top:16px"><div class="card-h"><div><div class="card-title">통계</div><div class="card-sub">결과파일에 있는 전체 내용을 엑셀형태로 화면에서 조회합니다.</div></div></div><div class="card-b"><div class="toolbar"><div class="field"><label>결과조회 파일 선택</label><select class="select" id="stat-select">${resultFiles.map((f,i)=>`<option value="${i}" ${String(i)===String(stat)?'selected':''}>${f}</option>`)}</select></div><div class="field wide"><label>검색</label><input class="input" id="stat-search" placeholder="컬럼별 검색"></div></div>${statTable(rows)}</div></section>`)}
function statRows(i){return [['수험번호','성명','전형','교시','고사장','고사실','응시상태','특이사항'],['C1001','김하늘',currentExam().name,'1교시','본교 제1고사장','J411','응시','신분증 미소지'],['C1002','이서연',currentExam().name,'1교시','본교 제1고사장','J308','결시','중도퇴실'],['C1003','박도윤',currentExam().name,'2교시','본교 제2고사장','423','응시','부정행위'],['C1004','최민준',currentExam().name,'2교시','예비고사장','B101','응시','-']]}function statTable(rows){return `<div class="table-wrap"><table><thead><tr>${rows[0].map(h=>`<th>${h} ▼</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function mobilePage(){let acc=state.accounts.find(a=>a.role==='middle')||state.accounts[1];return shell('중간관리자 모바일','장소안내는 사용자화면 확인용이며 전형 전체 조회·입력이 가능합니다.',`<div class="mobile-shell"><div class="mobile-screen"><h2>중간관리자</h2><div class="notice notice-info"><b>담당 장소 안내</b><br>${acc.placeGuide?acc.places:'장소안내 미사용'}<br><small>운영 범위: ${currentExam().name} 전체</small></div><div class="mobile-tab"><button class="btn btn-primary">고사실</button><button class="btn">특이사항</button><button class="btn">출결</button></div><div class="mobile-card"><b>본교 제1고사장 · J411</b><p>배정 53명 · 응시 14명 · 특이사항 4건</p><button class="btn btn-sm">상세</button></div><div class="mobile-card"><b>신분증 미소지</b><p>C1001 김하늘 · 촬영자 중간관리자 이중간</p><button class="btn btn-sm">사진비교</button></div><div class="notice notice-warn">모바일 운영 화면은 현재 기획 중이며, 현장 테스트 후 상세 동선을 추가 반영할 예정입니다.</div></div></div>`)}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{document.getElementById('login-id').value=b.dataset.demo;document.getElementById('login-pw').value='1234'});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b));let sel=document.getElementById('exam-select');if(sel)sel.onchange=e=>{state.currentExam=e.target.value;save();render()};document.querySelectorAll('[data-select-exam]').forEach(b=>b.onclick=()=>{state.currentExam=b.dataset.selectExam;save();render()});document.querySelectorAll('[data-uploadtab]').forEach(b=>b.onclick=()=>{state.uploadType=b.dataset.uploadtab;save();render()});document.querySelectorAll('[data-settab]').forEach(b=>b.onclick=()=>{state.settingsTab=b.dataset.settab;save();render()});document.querySelectorAll('[data-feature]').forEach(i=>i.onchange=()=>{state.features[i.dataset.feature]=i.checked;save();render()});document.querySelectorAll('[data-term]').forEach(i=>i.oninput=()=>state.terms[i.dataset.term]=i.value);document.querySelectorAll('[data-incident-name]').forEach(i=>i.oninput=()=>{state.incidents[+i.dataset.incidentName].name=i.value;save()});document.querySelectorAll('[data-incident-use]').forEach(i=>i.onchange=()=>{state.incidents[+i.dataset.incidentUse].use=i.checked;save();render()});document.querySelectorAll('[data-inc-auth]').forEach(i=>i.onchange=()=>{let [idx,k]=i.dataset.incAuth.split(':');state.incidents[+idx][k]=i.checked;save()});document.querySelectorAll('[data-schoolid]').forEach(b=>b.onclick=()=>generateId(b.dataset.schoolid));document.querySelectorAll('[data-close-site]').forEach(b=>b.onclick=()=>{state.closeSite=b.dataset.closeSite;state.showCloseConfirm=true;save();render()});let cs=document.getElementById('close-session');if(cs)cs.onchange=e=>{state.closeSession=e.target.value;save();render()};let cst=document.getElementById('close-site');if(cst)cst.onchange=e=>{state.closeSite=e.target.value;save();render()};document.querySelectorAll('[data-incident-go]').forEach(b=>b.onclick=()=>{state.incidentFilter=b.dataset.incidentGo;navigate('incidents')});let fil=document.getElementById('incident-filter');if(fil)fil.onchange=e=>{state.incidentFilter=e.target.value;save();render()};let ps=document.getElementById('photo-search');let ss=document.getElementById('site-search');document.querySelectorAll('[data-photo-select]').forEach(b=>b.onclick=()=>{state.selectedPhoto=b.dataset.photoSelect;save();render()});let stat=document.getElementById('stat-select');if(stat)stat.onchange=e=>{state.selectedStat=e.target.value;save();render()};}
function act(a,el){if(a==='login'){let id=document.getElementById('login-id').value.trim(),pw=document.getElementById('login-pw').value;if(pw!=='1234')return alert('비밀번호를 확인하세요');let role=Object.entries(roles).find(([k,v])=>v.id===id)?.[0];if(!role)return alert('계정이 없습니다');state.session={role,name:roles[role].label,id};save();navigate(roles[role].home)}if(a==='logout'){state.session=null;save();navigate('login')}if(a==='reset'){localStorage.removeItem(STORE);state=structuredClone(defaultState);navigate('login')}if(a==='school-add'){let c=document.getElementById('school-code').value.trim().toUpperCase(),n=document.getElementById('school-name').value.trim();if(!c||!n)return alert('학교코드와 학교명을 입력하세요');state.schools.push({code:c,name:n,ids:0});save();render()}if(a==='id-generate'){}if(a==='ids-download')downloadCsv('학교별_조회아이디.csv',[['학교','아이디','비밀번호','용도','상태'],...state.schoolIds.map(x=>[x.school,x.id,x.pw,x.purpose,x.status])]);if(a==='exam-create')openExamModal();if(a==='exam-disable'){let e=currentExam();e.status='사용중지';save();render()}if(a==='exam-delete'){if(confirm('선택 전형을 삭제할까요?')){state.exams=state.exams.filter(e=>e.id!==state.currentExam);state.currentExam=state.exams[0]?.id;save();render()}}if(a==='account-modal')openAccountModal();if(a==='terms-save'){save();alert('명칭을 저장했습니다.')}if(a==='choose-upload')document.getElementById('upload-file').click();if(a==='auto-assign'){state.upload.invigilator.name='감독관_자동배정완료.xlsx';state.upload.invigilator.ok=true;state.upload.invigilator.errors=[];save();alert('고사실코드 기준으로 감독관을 자동배정했습니다.')}if(a==='assign-download')downloadCsv('감독관_자동배정리스트.csv',[['감독관ID','감독관명','고사실코드','고사실'],['INV-11083-01','김민수','11083','J411'],['INV-11083-02','박지현','11083','J411']]);if(a==='settings-save'){save();alert('설정값을 저장했습니다.')}if(a==='incident-add'){if(state.incidents.length>=5)return alert('사고유형은 최대 5개입니다.');state.incidents.push({id:'inc'+Date.now(),name:'기타',use:true,invigilator:false,middle:false,count:0});save();render()}if(a==='pledge-save'){alert('사고유형별 각서 내용을 저장했습니다.')}if(a==='photo-search'){state.photoSearch=ps?.value||'';state.siteSearch=ss?.value||'';save();render()}if(a==='photo-confirm'){let s=students.find(x=>x.id===state.selectedPhoto);if(s){s.photo='확인';alert('입학처 확인 상태로 변경했습니다.');render()}}if(a==='close-filter'){state.showCloseConfirm=false;save();render()}if(a==='close-confirmed'){state.close[state.closeSession][state.closeSite]='마감완료';state.showCloseConfirm=false;save();render()}if(a==='close-cancel'){state.showCloseConfirm=false;save();render()}if(a==='download-all')alert('선택 전형의 결과파일 전체 다운로드를 시작합니다.');if(el?.dataset?.template)downloadTemplate(el.dataset.template)}
function generateId(code){let s=state.schools.find(x=>x.code===code);let cnt=state.schoolIds.filter(x=>x.school===code).length+1;state.schoolIds.push({school:code,id:`${code}-VIEW-${String(cnt).padStart(3,'0')}`,pw:'temp'+String(cnt).padStart(3,'0'),purpose:'입학처 조회용',status:'사용'});if(s)s.ids++;save();render()}
function openExamModal(){showModal('전형 생성',`<div class="field"><label>전형명</label><input class="input" id="new-exam-name" value="수시실기-연극"></div><div class="field"><label>시작일</label><input class="input" id="new-exam-start" type="date" value="2025-11-22"></div><div class="field"><label>종료일</label><input class="input" id="new-exam-end" type="date" value="2025-11-23"></div><div class="field"><label>메모</label><input class="input" id="new-exam-memo" value="실기고사 예시 전형"></div>`,`<button class="btn" data-close>취소</button><button class="btn btn-primary" id="save-exam">저장</button>`);document.getElementById('save-exam').onclick=()=>{let id='EXAM'+Date.now();state.exams.push({id,name:document.getElementById('new-exam-name').value,status:'사용',memo:document.getElementById('new-exam-memo').value,start:document.getElementById('new-exam-start').value,end:document.getElementById('new-exam-end').value});state.currentExam=id;save();closeModal();render()}}
function openAccountModal(){showModal('계정 생성/수정',`<div class="grid grid-2"><div class="field"><label>아이디</label><input class="input" id="acc-id" value="middle2"></div><div class="field"><label>이름</label><input class="input" id="acc-name" value="중간관리자2"></div></div><div class="field"><label>역할</label><select class="select" id="acc-role"><option value="exam">전형관리자</option><option value="middle" selected>중간관리자</option></select></div><div class="field"><label>메모</label><textarea class="textarea" id="acc-memo">중간관리자 장소안내용 계정</textarea></div><div class="notice notice-info"><b>중간관리자 장소안내</b><br>장소안내 사용 여부는 사용자화면 표시용입니다. 조회·입력 권한은 전형 전체입니다.</div><label class="switch" style="margin:12px 0"><input type="checkbox" id="acc-place" checked><span></span> 장소안내 사용</label><div class="field"><label>안내 장소</label><input class="input" id="acc-places" value="본교 제1고사장 · 학림관 J동"></div>`,`<button class="btn" data-close>취소</button><button class="btn btn-primary" id="save-account">저장</button>`);document.getElementById('save-account').onclick=()=>{state.accounts.push({id:document.getElementById('acc-id').value,name:document.getElementById('acc-name').value,role:document.getElementById('acc-role').value,memo:document.getElementById('acc-memo').value,status:'사용',placeGuide:document.getElementById('acc-place').checked,places:document.getElementById('acc-places').value});save();closeModal();render()}}
function showModal(title,body,footer){document.body.insertAdjacentHTML('beforeend',`<div class="modal-wrap" id="modal"><div class="modal"><div class="modal-h"><h3>${title}</h3><button class="btn btn-sm" data-close>닫기</button></div><div class="modal-b">${body}</div><div class="modal-f">${footer}</div></div></div>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){document.getElementById('modal')?.remove()}
function downloadCsv(name,rows){let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadTemplate(type){if(type==='candidate')downloadCsv('수험생_업로드_양식.csv',[['전형명','교시','날짜','시간','고사장','건물','고사실','고사실코드','수험번호','성명','생년월일','배정상태'],['수시논술','1교시','2025-11-16','09:30~11:00','본교 제1고사장','학림관','J411','11083','C1001','김하늘','20070101','배정']]);else if(type==='invigilator')downloadCsv('감독관_업로드_양식.csv',[['감독관명','역할','고사실코드','교시','연락처'],['김민수','정감독관','11083','1교시','010-0000-0000'],['박지현','부감독관','11083','1교시','010-0000-0001']]);else downloadCsv('사진ZIP_업로드_안내.csv',[['파일명규칙','설명'],['수험번호.jpg','예: C1001.jpg']])}
function setupUploadInput(){let file=document.getElementById('upload-file');if(!file)return;file.onchange=async()=>{let f=file.files[0];if(!f)return;let t=state.uploadType;if(f.name.includes('오류')){state.upload[t]={name:f.name,ok:false,rows:0,errors:[{row:3,col:'고사실코드',val:'',msg:'필수값 누락',fix:'고사실코드를 입력 후 다시 업로드'}]};state.uploadBlocked=true}else{state.upload[t]={name:f.name,ok:true,rows:t==='candidate'?18:t==='invigilator'?8:18,errors:[]};state.uploadBlocked=false}save();render()}}
const oldBind=bind;bind=function(){oldBind();setupUploadInput()};
render();
</script></body></html>
